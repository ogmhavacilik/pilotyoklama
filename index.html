                    const isWe = dObj.getDay() === 0 || dObj.getDay() === 6;
                    if (isWe) return { status: undefined };

                    const hist = allRecs
                        .filter(x => String(x.personId) === pIdStr && x.date < selectedDateStr && x.status && x.status !== '')
                        .sort((a, b) => b.date.localeCompare(a.date))[0];

                    if (hist && [AttendanceStatus.PRESENT, AttendanceStatus.DUTY].includes(hist.status)) {
                        return { ...hist, leaveType: hist.leaveType || LeaveType.DAILY, dutyType: hist.dutyType || DutyType.PLANNED };
                    }
                    return { status: AttendanceStatus.PRESENT };
                };

                const groupedData = {
                    MEVCUT: [],
                    GOREV: [],
                    KURS: [],
                    IZIN: [],
                    RAPOR: [],
                    DIGER: []
                };

                if (selectedMobileUnit && !isLiveSyncing && !isUnitsLoading) {
                    mobileFilteredPersonnel.forEach(p => {
                        const res = getResolvedStatus(p);
                        const st = res.status;
                        const pObj = { person: p, record: res };

                        if (st === AttendanceStatus.PRESENT) {
                            groupedData.MEVCUT.push(pObj);
                        } else if (st === AttendanceStatus.DUTY) {
                            groupedData.GOREV.push(pObj);
                        } else if (st === AttendanceStatus.COURSE) {
                            groupedData.KURS.push(pObj);
                        } else if (st === AttendanceStatus.LEAVE) {
                            groupedData.IZIN.push(pObj);
                        } else if (st === AttendanceStatus.SICK) {
                            groupedData.RAPOR.push(pObj);
                        } else {
                            groupedData.DIGER.push(pObj);
                        }
                    });
                }

                return (
                    <div className="min-h-screen bg-forest-950 text-white p-3 space-y-3 pb-24">
                        <div className="flex items-center justify-between border-b border-forest-800 pb-2 pt-1">
                            <div>
                                <h1 className="text-base font-bold text-teal-300 tracking-tight">BAKIM ŞUBE YOKLAMA</h1>
                                <p className="text-[10px] text-forest-400">Mobil Hızlı Veri Görünümü</p>
                            </div>
                            {(isLiveSyncing || isUnitsLoading) ? (
                                <span className="text-[10px] bg-forest-900 text-teal-300 px-2 py-1 rounded border border-teal-500/40 flex items-center gap-1 animate-pulse font-bold">
                                    <Loader2 className="animate-spin" size={10} /> E-Tablo Yükleniyor...
                                </span>
                            ) : (
                                <span className="text-[10px] bg-forest-900 text-emerald-300 px-2 py-1 rounded border border-emerald-500/40 flex items-center gap-1">
                                    <CheckCircle2 size={10} /> Canlı Veri Hazır
                                </span>
                            )}
                        </div>

                        <div className="bg-forest-900 p-2.5 rounded-xl border border-forest-800 space-y-2.5">
                            <div className="flex items-center justify-between gap-2">
                                <span className="text-xs text-forest-300 font-bold">Tarih:</span>
                                <input 
                                    type="date" 
                                    value={dates.start} 
                                    onChange={e => setDates({ start: e.target.value, end: e.target.value })} 
                                    disabled={isLiveSyncing || isUnitsLoading}
                                    className="bg-forest-950 text-white border border-forest-700 rounded px-2 py-1 text-xs outline-none disabled:opacity-40 disabled:cursor-not-allowed"
                                />
                            </div>

                            <div>
                                <label className="text-[10px] font-bold text-forest-400 uppercase tracking-wider block mb-1">
                                    Birim Seçimi (Aşağı Açılır Liste)
                                </label>
                                <div className="flex items-center gap-2">
                                    <select 
                                        value={selectedMobileUnit} 
                                        onChange={e => setSelectedMobileUnit(e.target.value)}
                                        disabled={isLiveSyncing || isUnitsLoading}
                                        className="flex-1 bg-forest-950 border border-teal-500/60 text-teal-300 text-xs font-extrabold rounded-lg p-2.5 outline-none focus:ring-2 focus:ring-teal-400 disabled:opacity-50 disabled:cursor-not-allowed"
                                    >
                                        {(isLiveSyncing || isUnitsLoading) ? (
                                            <option value="">⌛ Veriler E-Tablo'dan Alınıyor...</option>
                                        ) : (
                                            <option value="">-- LÜTFEN BİRİM SEÇİNİZ --</option>
                                        )}
                                        <option value="BELL-429">🚁 BELL-429</option>
                                        <option value="C-650">🛩️ C-650</option>
                                        <option value="B-360">🛩️ B-360</option>
                                        <option value="T-70">🚁 T-70</option>
                                        <option value="AT-802">🛩️ AT-802</option>
                                        <option value="İDARİ">🏢 İDARİ</option>
                                    </select>

                                    {selectedMobileUnit && !isLiveSyncing && !isUnitsLoading && (
                                        <button 
                                            onClick={() => handleUnitSelection(selectedMobileUnit)}
                                            className="bg-teal-600 active:bg-teal-700 text-white text-xs font-bold px-3 py-2.5 rounded-lg border border-teal-400 whitespace-nowrap shadow-md flex items-center gap-1"
                                        >
                                            ✏️ Yoklama Gir
                                        </button>
                                    )}
                                </div>
                            </div>
                        </div>

                        {(isLiveSyncing || isUnitsLoading) ? (
                            <div className="bg-forest-900/90 border border-teal-500/50 rounded-xl p-5 text-center space-y-2.5 my-3 shadow-lg">
                                <Loader2 className="animate-spin text-teal-400 mx-auto" size={28} />
                                <div className="font-bold text-teal-300 text-xs">E-Tablo Verileri Alınıyor...</div>
                                <p className="text-[10px] text-forest-300">
                                    Doğru ve güncel yoklama verileri Google E-Tablo'dan yüklenene kadar birim seçimi ve butonlar kilitlidir. Lütfen birkaç saniye bekleyiniz...
                                </p>
                            </div>
                        ) : !selectedMobileUnit ? (
                            <div className="bg-forest-900/80 border border-forest-800 rounded-xl p-6 text-center text-forest-300 text-xs space-y-2 my-4 shadow-md">
                                <div className="text-3xl">📋</div>
                                <div className="font-bold text-white text-sm">Lütfen Birim Seçiniz</div>
                                <p className="text-forest-400 text-[11px]">
                                    Yoklama durumunu görüntülemek ve veri girmek için lütfen yukarıdaki açılır menüden bir birim seçiniz.
                                </p>
                            </div>
                        ) : (
                            <>
                                <div className="grid grid-cols-3 gap-1.5 text-center text-[10px] font-bold">
                                    <div className="bg-green-950/80 border border-green-700/60 p-1.5 rounded-lg text-green-300">
                                        MEVCUT: <span className="text-xs text-white ml-0.5">{groupedData.MEVCUT.length}</span>
                                    </div>
                                    <div className="bg-blue-950/80 border border-blue-700/60 p-1.5 rounded-lg text-blue-300">
                                        GÖREV: <span className="text-xs text-white ml-0.5">{groupedData.GOREV.length}</span>
                                    </div>
                                    <div className="bg-yellow-950/80 border border-yellow-700/60 p-1.5 rounded-lg text-yellow-300">
                                        İZİN/FMİ: <span className="text-xs text-white ml-0.5">{groupedData.IZIN.length}</span>
                                    </div>
                                </div>

                                <div className="space-y-3 pt-1">
                                    {groupedData.GOREV.length > 0 && (
                                        <div className="bg-forest-900/90 border border-blue-600/50 rounded-xl p-2.5 space-y-2 shadow-lg">
                                            <div className="flex items-center justify-between border-b border-blue-500/30 pb-1.5">
                                                <span className="text-xs font-black text-blue-400 flex items-center gap-1.5">
                                                    ✈️ GÖREVDE OLANLAR
                                                </span>
                                                <span className="bg-blue-600 text-white text-[10px] font-bold px-2 py-0.5 rounded-full">
                                                    {groupedData.GOREV.length} Kişi
                                                </span>
                                            </div>
                                            <div className="space-y-1.5">
                                                {groupedData.GOREV.map(({ person, record }) => (
                                                    <div key={person.id} className="bg-forest-950/70 p-2 rounded-lg border border-forest-800 flex items-center justify-between text-xs">
                                                        <div>
                                                            <div className="font-bold text-white">{person.fullName}</div>
                                                            <div className="text-[10px] text-forest-400">{getDisplayTitle(person.title, person.role)}</div>
                                                        </div>
                                                        <div className="text-right">
                                                            <div className="text-[11px] font-bold text-blue-300">{record.dutyLocation || 'GÖREVDE'}</div>
                                                            {record.dutyLocationDetail && (
                                                                <div className="text-[9px] text-forest-400">{record.dutyLocationDetail}</div>
                                                            )}
                                                        </div>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    )}

                                    {groupedData.IZIN.length > 0 && (
                                        <div className="bg-forest-900/90 border border-yellow-600/50 rounded-xl p-2.5 space-y-2 shadow-lg">
                                            <div className="flex items-center justify-between border-b border-yellow-500/30 pb-1.5">
                                                <span className="text-xs font-black text-yellow-400 flex items-center gap-1.5">
                                                    🌴 İZİNLİ / FMİ
                                                </span>
                                                <span className="bg-yellow-600 text-black text-[10px] font-bold px-2 py-0.5 rounded-full">
                                                    {groupedData.IZIN.length} Kişi
                                                </span>
                                            </div>
                                            <div className="space-y-1.5">
                                                {groupedData.IZIN.map(({ person, record }) => (
                                                    <div key={person.id} className="bg-forest-950/70 p-2 rounded-lg border border-forest-800 flex items-center justify-between text-xs">
                                                        <div>
                                                            <div className="font-bold text-white">{person.fullName}</div>
                                                            <div className="text-[10px] text-forest-400">{getDisplayTitle(person.title, person.role)}</div>
                                                        </div>
                                                        <div className="text-[11px] font-bold text-yellow-300">
                                                            {record.leaveType === LeaveType.OVERTIME ? 'FAZLA MESAİ İZNİ (F.M.İ)' : (record.leaveType || 'İZİNLİ')}
                                                        </div>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    )}

                                    {groupedData.KURS.length > 0 && (
                                        <div className="bg-forest-900/90 border border-indigo-600/50 rounded-xl p-2.5 space-y-2 shadow-lg">
                                            <div className="flex items-center justify-between border-b border-indigo-500/30 pb-1.5">
                                                <span className="text-xs font-black text-indigo-400 flex items-center gap-1.5">
                                                    🎓 KURSTA OLANLAR
                                                </span>
                                                <span className="bg-indigo-600 text-white text-[10px] font-bold px-2 py-0.5 rounded-full">
                                                    {groupedData.KURS.length} Kişi
                                                </span>
                                            </div>
                                            <div className="space-y-1.5">
                                                {groupedData.KURS.map(({ person, record }) => (
                                                    <div key={person.id} className="bg-forest-950/70 p-2 rounded-lg border border-forest-800 flex items-center justify-between text-xs">
                                                        <div>
                                                            <div className="font-bold text-white">{person.fullName}</div>
                                                            <div className="text-[10px] text-forest-400">{getDisplayTitle(person.title, person.role)}</div>
                                                        </div>
                                                        <div className="text-[11px] font-bold text-indigo-300">
                                                            {record.dutyLocation || 'KURSTA'}
                                                        </div>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    )}

                                    {groupedData.RAPOR.length > 0 && (
                                        <div className="bg-forest-900/90 border border-red-600/50 rounded-xl p-2.5 space-y-2 shadow-lg">
                                            <div className="flex items-center justify-between border-b border-red-500/30 pb-1.5">
                                                <span className="text-xs font-black text-red-400 flex items-center gap-1.5">
                                                    🏥 RAPORLU
                                                </span>
                                                <span className="bg-red-600 text-white text-[10px] font-bold px-2 py-0.5 rounded-full">
                                                    {groupedData.RAPOR.length} Kişi
                                                </span>
                                            </div>
                                            <div className="space-y-1.5">
                                                {groupedData.RAPOR.map(({ person }) => (
                                                    <div key={person.id} className="bg-forest-950/70 p-2 rounded-lg border border-forest-800 flex items-center justify-between text-xs">
                                                        <div>
                                                            <div className="font-bold text-white">{person.fullName}</div>
                                                            <div className="text-[10px] text-forest-400">{getDisplayTitle(person.title, person.role)}</div>
                                                        </div>
                                                        <div className="text-[11px] font-bold text-red-400">RAPORLU</div>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    )}

                                    <div className="bg-forest-900/90 border border-green-600/50 rounded-xl p-2.5 space-y-2 shadow-lg">
                                        <div className="flex items-center justify-between border-b border-green-500/30 pb-1.5">
                                            <span className="text-xs font-black text-green-400 flex items-center gap-1.5">
                                                ✅ MEVCUT (İŞ BAŞINDA)
                                            </span>
                                            <span className="bg-green-600 text-white text-[10px] font-bold px-2 py-0.5 rounded-full">
                                                {groupedData.MEVCUT.length} Kişi
                                            </span>
                                        </div>
                                        {groupedData.MEVCUT.length === 0 ? (
                                            <p className="text-[11px] text-forest-400 italic text-center py-2">Mevcut kaydı bulunamadı.</p>
                                        ) : (
                                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-1.5">
                                                {groupedData.MEVCUT.map(({ person }) => (
                                                    <div key={person.id} className="bg-forest-950/70 p-2 rounded-lg border border-forest-800/80 flex items-center justify-between text-xs">
                                                        <div>
                                                            <div className="font-bold text-white">{person.fullName}</div>
                                                            <div className="text-[10px] text-forest-400">{getDisplayTitle(person.title, person.role)}</div>
                                                        </div>
                                                        <span className="text-[10px] font-bold bg-green-950 text-green-300 border border-green-600/50 px-2 py-0.5 rounded">MEVCUT</span>
                                                    </div>
                                                ))}
                                            </div>
                                        )}
                                    </div>

                                    {groupedData.DIGER.length > 0 && (
                                        <div className="bg-forest-900/90 border border-purple-600/50 rounded-xl p-2.5 space-y-2 shadow-lg">
                                            <div className="flex items-center justify-between border-b border-purple-500/30 pb-1.5">
                                                <span className="text-xs font-black text-purple-400 flex items-center gap-1.5">
                                                    📌 BEKLEME
                                                </span>
                                                <span className="bg-purple-600 text-white text-[10px] font-bold px-2 py-0.5 rounded-full">
                                                    {groupedData.DIGER.length} Kişi
                                                </span>
                                            </div>
                                            <div className="space-y-1.5">
                                                {groupedData.DIGER.map(({ person, record }) => {
                                                    const hasNote = record.note && record.note.trim() !== '';
                                                    const isBekleme = !hasNote || record.note.toLocaleUpperCase('tr-TR').includes('BEKLEME');
                                                    const displayExplanation = hasNote ? record.note : 'BEKLEME';

                                                    return (
                                                        <div key={person.id} className="bg-forest-950/70 p-2 rounded-lg border border-forest-800 flex items-center justify-between text-xs">
                                                            <div>
                                                                <div className="font-bold text-white">{person.fullName}</div>
                                                                <div className="text-[10px] text-forest-400">{getDisplayTitle(person.title, person.role)}</div>
                                                            </div>
                                                            <div className="text-right">
                                                                <div className="text-[11px] font-bold text-purple-300">
                                                                    {displayExplanation}
                                                                </div>
                                                                {isBekleme && (
                                                                    <div className="text-[9px] text-forest-400">BEKLEME NÖBETİ</div>
                                                                )}
                                                            </div>
                                                        </div>
                                                    );
                                                })}
                                            </div>
                                        </div>
                                    )}
                                </div>
                            </>
                        )}

                        <div className="grid grid-cols-3 gap-1.5 pt-2">
                            <button 
                                onClick={() => setReportModalType('MESAI')} 
                                disabled={isLiveSyncing || isUnitsLoading}
                                className="bg-orange-600 active:bg-orange-700 text-white font-bold py-2 px-1 rounded-lg text-[11px] text-center border border-orange-400 shadow-md disabled:opacity-40 disabled:cursor-not-allowed disabled:pointer-events-none"
                            >
                                MESAİ (GÜNLÜK)
                            </button>
                            <button 
                                onClick={() => setReportModalType('FMİ')} 
                                disabled={isLiveSyncing || isUnitsLoading}
                                className="bg-orange-600 active:bg-orange-700 text-white font-bold py-2 px-1 rounded-lg text-[11px] text-center border border-orange-400 shadow-md disabled:opacity-40 disabled:cursor-not-allowed disabled:pointer-events-none"
                            >
                                FMİ (GÜNLÜK)
                            </button>
                            <button 
                                onClick={() => setReportModalType('GÖREV')} 
                                disabled={isLiveSyncing || isUnitsLoading}
                                className="bg-orange-600 active:bg-orange-700 text-white font-bold py-2 px-1 rounded-lg text-[11px] text-center border border-orange-400 shadow-md disabled:opacity-40 disabled:cursor-not-allowed disabled:pointer-events-none"
                            >
                                GÖREV (GÜNLÜK)
                            </button>
                        </div>

                        <div className="bg-forest-900 p-2.5 rounded-xl border border-forest-800 space-y-2">
                            <span className="text-xs font-bold text-forest-300 block">Excel Rapor İndir</span>
                            <div className="flex gap-2">
                                <button 
                                    onClick={() => exportExcel(true)} 
                                    disabled={isLiveSyncing || isUnitsLoading}
                                    className="flex-1 bg-blue-600 active:bg-blue-700 text-white text-xs font-bold py-2 rounded-lg shadow disabled:opacity-40 disabled:cursor-not-allowed disabled:pointer-events-none"
                                >
                                    Bugünkü Rapor
                                </button>
                                <button 
                                    onClick={() => {
                                        setRangeExportStart(dates.start || getTodayString());
                                        setRangeExportEnd(dates.end || getTodayString());
                                        setShowRangeReportModal(true);
                                    }} 
                                    disabled={isLiveSyncing || isUnitsLoading}
                                    className="flex-1 bg-emerald-600 active:bg-emerald-700 text-white text-xs font-bold py-2 rounded-lg shadow disabled:opacity-40 disabled:cursor-not-allowed disabled:pointer-events-none"
                                >
                                    Aralıklı Rapor
                                </button>
                            </div>
                        </div>

                        {showRangeReportModal && (
                            <div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                                <div className="bg-forest-900 border border-emerald-500/60 rounded-xl max-w-sm w-full p-4 space-y-4 shadow-2xl">
                                    <div className="flex items-center justify-between border-b border-forest-800 pb-2">
                                        <h3 className="font-bold text-emerald-300 text-sm flex items-center gap-2">
                                            📊 Aralıklı Excel Raporu
                                        </h3>
                                        <button 
                                            onClick={() => setShowRangeReportModal(false)}
                                            className="text-forest-400 hover:text-white p-1"
                                        >
                                            <X size={18} />
                                        </button>
                                    </div>
                                    
                                    <p className="text-xs text-forest-300">
                                        Lütfen raporlamak istediğiniz başlangıç ve bitiş tarihlerini seçiniz:
                                    </p>

                                    <div className="space-y-3">
                                        <div>
                                            <label className="text-[11px] text-forest-400 font-bold block mb-1">Başlangıç Tarihi:</label>
                                            <input 
                                                type="date" 
                                                value={rangeExportStart}
                                                onChange={e => setRangeExportStart(e.target.value)}
                                                className="w-full bg-forest-950 border border-forest-700 rounded-lg p-2 text-xs text-white outline-none focus:border-emerald-500"
                                            />
                                        </div>
                                        <div>
                                            <label className="text-[11px] text-forest-400 font-bold block mb-1">Bitiş Tarihi:</label>
                                            <input 
                                                type="date" 
                                                value={rangeExportEnd}
                                                onChange={e => setRangeExportEnd(e.target.value)}
                                                className="w-full bg-forest-950 border border-forest-700 rounded-lg p-2 text-xs text-white outline-none focus:border-emerald-500"
                                            />
                                        </div>
                                    </div>

                                    <div className="flex gap-2 pt-2">
                                        <button 
                                            onClick={() => setShowRangeReportModal(false)}
                                            className="flex-1 bg-forest-800 hover:bg-forest-700 text-white text-xs font-bold py-2.5 rounded-lg"
                                        >
                                            İptal
                                        </button>
                                        <button 
                                            onClick={() => {
                                                setDates({ start: rangeExportStart, end: rangeExportEnd });
                                                setShowRangeReportModal(false);
                                                setTimeout(() => {
                                                    exportExcel(false);
                                                }, 100);
                                            }}
                                            className="flex-1 bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold py-2.5 rounded-lg border border-emerald-400 shadow-md flex items-center justify-center gap-1.5"
                                        >
                                            <Download size={14} /> Excel İndir
                                        </button>
                                    </div>
                                </div>
                            </div>
                        )}

                        {reportModalType && (
                            <ReportDialog 
                                type={reportModalType} 
                                onClose={() => setReportModalType(null)} 
                                personnel={allPersonnel} 
                                attendance={allRecs} 
                                reportUnit={reportUnit}
                                reportSearch={reportSearch}
                                selectedDate={dates.start}
                            />
                        )}
                    </div>
                );
            }

            if (!selModel) return (
                <div className="container mx-auto p-4 max-w-5xl space-y-8 animate-fade-in relative">
                    <div className="flex items-center justify-between mb-4">
                        <h1 className="text-3xl font-bold text-white">Yoklama Takip</h1>
                        {isLiveSyncing ? (
                            <span className="text-xs font-medium text-teal-300 flex items-center gap-1.5 bg-forest-900 px-3 py-1.5 rounded-lg border border-teal-500/40 shadow-sm animate-pulse">
                                <Loader2 className="animate-spin text-teal-400" size={14} />
                                <span>E-Tablo ile eşitleniyor...</span>
                            </span>
                        ) : (
                            <span className="text-xs font-medium text-emerald-300 flex items-center gap-1.5 bg-forest-900 px-3 py-1.5 rounded-lg border border-emerald-500/40 shadow-sm">
                                <CheckCircle2 className="text-emerald-400" size={14} />
                                <span>Canlı Güncel</span>
                            </span>
                        )}
                    </div>
                    <Card title="Birim Seçiniz">
                        <div className={`relative grid grid-cols-2 md:grid-cols-3 gap-4 transition-all duration-300 ${isUnitsLoading && models.length === 0 ? 'blur-md pointer-events-none opacity-40' : ''}`}>
                            {models.map(m => {
                                const stat = dashboardStatus[m] || { pilotMissing: false, groundMissing: false };
                                const hasIssue = stat.pilotMissing || stat.groundMissing;
                                return (
                                <button key={m} onClick={() => handleUnitSelection(m)} className={`p-6 rounded border-2 font-bold flex flex-col items-center transition-all group relative overflow-hidden ${!hasIssue ? 'bg-teal-600 border-teal-400 hover:bg-teal-500 text-white' : 'bg-forest-800 border-forest-600 hover:bg-forest-700 text-white'}`}>
                                    <ModelIcon category={inv.find(a => a.model === m)?.category} model={m} className="mb-2" /> {m}
                                    {stat.groundMissing && <span className="text-[10px] bg-red-600 px-2 py-0.5 rounded mt-2 animate-pulse w-full block">YOKLAMA GİRİLMEDİ</span>}
                                    {stat.pilotMissing && <span className="text-[10px] bg-orange-600 px-2 py-0.5 rounded mt-1 animate-pulse w-full block">PİLOT GİRİLMEDİ</span>}
                                </button>
                            )})}
                        </div>
                        {isUnitsLoading && models.length === 0 && (
                            <div className="absolute inset-0 flex flex-col items-center justify-center bg-forest-950/85 rounded-lg z-20 backdrop-blur-md p-4 text-center">
                                <Loader2 className="animate-spin text-teal-400 mb-3" size={44} />
                                <span className="text-base sm:text-lg font-bold text-teal-300 bg-forest-900/95 px-6 py-3 rounded-xl border border-teal-500/80 shadow-2xl tracking-wide uppercase animate-pulse">
                                    Veriler alınıyor...
                                </span>
                            </div>
                        )}
                    </Card>

                    <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                        <button 
                            onClick={() => setReportModalType('MESAI')} 
                            className="bg-orange-600 hover:bg-orange-500 text-white font-bold py-6 rounded-2xl shadow-[0_10px_20px_-10px_rgba(234,88,12,0.5)] flex flex-col items-center justify-center gap-3 transition-all active:scale-95 border-2 border-orange-400 group overflow-hidden relative"
                        >
                            <div className="absolute inset-0 bg-white/10 translate-y-full group-hover:translate-y-0 transition-transform duration-300"></div>
                            <span className="text-xl relative z-10 tracking-tight">MESAİ (GÜNLÜK)</span>
                        </button>
                        <button 
                            onClick={() => setReportModalType('FMİ')} 
                            className="bg-orange-600 hover:bg-orange-500 text-white font-bold py-6 rounded-2xl shadow-[0_10px_20px_-10px_rgba(234,88,12,0.5)] flex flex-col items-center justify-center gap-3 transition-all active:scale-95 border-2 border-orange-400 group overflow-hidden relative"
                        >
                            <div className="absolute inset-0 bg-white/10 translate-y-full group-hover:translate-y-0 transition-transform duration-300"></div>
                            <span className="text-xl relative z-10 tracking-tight">FAZLA MESAİ (GÜNLÜK)</span>
                        </button>
                        <button 
                            onClick={() => setReportModalType('GÖREV')} 
                            className="bg-orange-600 hover:bg-orange-500 text-white font-bold py-6 rounded-2xl shadow-[0_10px_20px_-10px_rgba(234,88,12,0.5)] flex flex-col items-center justify-center gap-3 transition-all active:scale-95 border-2 border-orange-400 group overflow-hidden relative"
                        >
                            <div className="absolute inset-0 bg-white/10 translate-y-full group-hover:translate-y-0 transition-transform duration-300"></div>
                            <span className="text-xl relative z-10 tracking-tight">GÖREV (GÜNLÜK)</span>
                        </button>
                    </div>

                    <Card title="Raporlar ve Çıktılar">
                        <div className="flex flex-col gap-6">
                            <div className="bg-forest-900/80 p-6 rounded-lg border border-forest-600 shadow-md">
                                <h3 className="text-forest-100 font-semibold mb-4 flex items-center gap-2"><Calendar className="text-forest-400" /> Rapor Filtreleri</h3>
                                <div className="grid grid-cols-1 md:grid-cols-3 gap-4 mb-4">
                                     <div>
                                        <label className="text-xs text-forest-400 block mb-1">Birim Seçimi</label>
                                        <select className="w-full bg-forest-950 border border-forest-600 text-white rounded p-2 text-sm" value={reportUnit} onChange={(e) => setReportUnit(e.target.value)}><option value="TÜM BİRİMLER">TÜM BİRİMLER</option>{models.map(m => <option key={m} value={m}>{m}</option>)}</select>
                                     </div>
                                     <div>
                                        <label className="text-xs text-forest-400 block mb-1">Personel Arama</label>
                                        <div className="relative"><Search size={16} className="absolute left-2 top-2.5 text-forest-400"/><input type="text" list="personnel-list" placeholder="İsim Ara..." className="w-full bg-forest-950 border border-forest-700 rounded p-2 pl-8 text-sm" value={reportSearch} onChange={(e) => setReportSearch(e.target.value)}/><datalist id="personnel-list">{allPersonnel.map(p => <option key={p.id} value={p.fullName} />)}</datalist></div>
                                     </div>
                                </div>
                                <h3 className="text-forest-100 font-semibold mb-2 flex items-center gap-2 text-sm"><CalendarDays className="text-forest-400" size={16} /> Tarih Aralığı</h3>
                                <div className="flex flex-wrap items-end gap-4">
                                    <div><label className="text-xs text-forest-400">Başlangıç</label><input type="date" value={dates.start} onChange={e => { setDates({ ...dates, start: e.target.value }); setIsReportReady(false) }} className="bg-forest-950 border border-forest-600 text-white rounded p-2 text-sm" /></div>
                                    <div><label className="text-xs text-forest-400">Bitiş</label><input type="date" value={dates.end} onChange={e => { setDates({ ...dates, end: e.target.value }); setIsReportReady(false) }} className="bg-forest-950 border border-forest-600 text-white rounded p-2 text-sm" /></div>
                                    <Button onClick={() => exportExcel(false)} variant="success">Rapor İndir (EXCEL)</Button>
                                    <div className="h-8 w-px bg-forest-600 mx-2"></div>
                                    <Button onClick={() => exportExcel(true)} className="bg-blue-600 hover:bg-blue-500">Günlük Rapor İndir (BUGÜN)</Button>
                                </div>
                            </div>
                        </div>
                    </Card>
                    
                    {reportModalType && (
                        <ReportDialog 
                            type={reportModalType} 
                            onClose={() => setReportModalType(null)} 
                            personnel={allPersonnel} 
                            attendance={allRecs} 
                            reportUnit={reportUnit}
                            reportSearch={reportSearch}
                            selectedDate={dates.start}
                        />
                    )}
                </div>
            );

            const pilots = people.filter(p => p.role === Role.PILOT || (p.title && p.title.toLocaleUpperCase('tr-TR').includes('PİLOT')));
            const others = people.filter(p => !pilots.includes(p));
            const allPersonnelList = [...pilots, ...others];

            // MOBILE PERSONNEL ATTENDANCE VIEW
            if (isMobile) {
                return (
                    <div className="min-h-screen bg-forest-950 text-white p-2.5 pb-24 space-y-3">
                        <div className="sticky top-0 bg-forest-950/95 pt-1 pb-2 border-b border-forest-800 z-30 flex items-center justify-between gap-2">
                            <button 
                                onClick={handleBackToDashboard} 
                                className="bg-forest-800 active:bg-forest-700 text-white px-2.5 py-1.5 rounded text-xs font-bold flex items-center gap-1 border border-forest-700"
                            >
                                <ArrowUp className="rotate-[-90deg]" size={14} /> Geri
                            </button>
                            <div className="flex items-center gap-1">
                                <ModelIcon model={selModel} category={inv.find(a => a.model === selModel)?.category} size={16} />
                                <span className="font-extrabold text-sm text-teal-300 truncate max-w-[130px]">{selModel}</span>
                            </div>
                            <input 
                                type="date" 
                                value={rangeStartDate} 
                                onChange={e => {
                                    if (hasUnsavedChanges) save(true);
                                    setRangeStartDate(e.target.value);
                                    setRangeEndDate(e.target.value);
                                }}
                                className="bg-forest-900 border border-forest-700 text-white text-xs rounded px-1.5 py-1 outline-none w-28"
                            />
                        </div>

                        <div className="relative">
                            <Search size={14} className="absolute left-2.5 top-2.5 text-forest-400" />
                            <input 
                                type="text" 
                                placeholder="Personel Ara..." 
                                className="w-full bg-forest-900 border border-forest-800 rounded-lg py-1.5 pl-8 pr-8 text-xs text-white outline-none focus:border-teal-500" 
                                value={searchName || ''} 
                                onChange={e => setSearchName(e.target.value)} 
                            />
                            {searchName && (
                                <button onClick={() => setSearchName(null)} className="absolute right-2.5 top-2.5 text-forest-400">
                                    <X size={14} />
                                </button>
                            )}
                        </div>

                        <div className="space-y-2">
                            {allPersonnelList.map((p, i) => {
                                const s = att[p.id] || {};
                                return (
                                    <div key={p.id} className="bg-forest-900/90 border border-forest-800 p-2.5 rounded-lg">
                                        <div className="flex items-center justify-between border-b border-forest-800/80 pb-1.5 mb-1.5">
                                            <div className="flex items-center gap-2">
                                                <span className="text-[11px] font-bold text-forest-400 w-4">{i + 1}.</span>
                                                <div>
                                                    <div className="font-bold text-white text-sm leading-tight">{p.fullName}</div>
                                                    <div className="text-[10px] text-forest-300">{getDisplayTitle(p.title, p.role)}</div>
                                                </div>
                                            </div>
                                        </div>
                                        <MobileAttendanceControl 
                                            personId={p.id} 
                                            state={s} 
                                            isWeeklyMode={rangeStartDate !== rangeEndDate} 
                                            onChangeStatus={handleStatusChangeWithAuth} 
                                            onChangeDetail={handleDetailChangeWithAuth} 
                                            isWeekend={(() => {
                                                const d = new Date(rangeStartDate + 'T12:00:00');
                                                return d.getDay() === 0 || d.getDay() === 6;
                                            })()}
                                            sortedCities={sortedCities}
                                        />
                                    </div>
                                );
                            })}
                        </div>

                        <div className="fixed bottom-0 left-0 right-0 p-2.5 bg-forest-950 border-t border-forest-800 z-50 flex items-center justify-center">
                            <button 
                                onClick={() => save(false)} 
                                disabled={isSaving} 
                                className={`w-full py-3 rounded-lg font-extrabold text-sm flex items-center justify-center gap-2 transition-all active:scale-95 shadow-lg ${
                                    hasUnsavedChanges 
                                        ? 'bg-amber-500 text-black border-2 border-amber-300 animate-pulse' 
                                        : 'bg-emerald-600 text-white'
                                }`}
                            >
                                {isSaving ? (
                                    <>
                                        <Loader2 className="animate-spin" size={16} />
                                        <span>Kaydediliyor...</span>
                                    </>
                                ) : (
                                    <>
                                        <Save size={16} />
                                        <span>KAYDET {hasUnsavedChanges ? '(DEĞİŞİKLİK VAR)' : '✓'}</span>
                                    </>
                                )}
                            </button>
                        </div>
                    </div>
                );
            }

            return (
                <div className="container mx-auto p-4 max-w-6xl animate-fade-in relative">
                    {showUnlockModal && (
                        <div className="fixed inset-0 bg-black/80 z-[100] flex items-center justify-center p-4">
                            <div className="bg-forest-900 border border-forest-500 p-6 rounded-lg max-w-sm w-full shadow-[0_0_50px_rgba(0,0,0,0.8)] animate-slide-down">
                                <div className="flex flex-col items-center mb-4"><div className="bg-forest-800 p-3 rounded-full mb-3 border border-forest-600"><Lock size={32} className="text-forest-400" /></div><h3 className="text-xl font-bold text-white">Düzenleme Kilidi</h3><p className="text-sm text-forest-300 text-center mt-2">Değişiklik yapabilmek için lütfen yönetici şifresini giriniz.</p></div>
                                <form onSubmit={handleUnlock}><input type="password" placeholder="Şifre" className="w-full bg-forest-950 border border-forest-700 rounded p-3 text-white mb-4 focus:ring-2 focus:ring-forest-400 focus:outline-none text-center tracking-widest text-lg" autoFocus value={unlockPassword} onChange={(e) => setUnlockPassword(e.target.value)}/><div className="flex gap-2"><Button variant="secondary" type="button" onClick={() => { setShowUnlockModal(false); setPendingAction(null); setUnlockPassword(''); }} className="w-full">İptal</Button><Button type="submit" className="w-full">Kilidi Aç</Button></div></form>
                            </div>
                        </div>
                    )}
                    <div className={`flex flex-col lg:flex-row justify-between items-start lg:items-center mb-4 text-white bg-forest-700/50 p-4 rounded border border-forest-600 gap-4 sticky top-4 z-50 shadow-lg backdrop-blur-md bg-forest-700/90 ${(isSaving || savePromiseRef.current) ? 'pointer-events-none opacity-50 select-none' : ''}`}>
                        <div className="flex items-center gap-4">
                            <h2 className="text-xl font-bold flex items-center gap-2"><ModelIcon model={selModel} category={inv.find(a => a.model === selModel)?.category} /> {selModel}</h2>
                            {isOrderChanged && (
                                <button onClick={saveOrder} disabled={isSaving || !!savePromiseRef.current} className="bg-orange-600 hover:bg-orange-500 text-white px-3 py-1 rounded text-xs font-bold animate-pulse flex items-center gap-1 disabled:opacity-50">
                                    <Save size={14} /> Sıralamayı Kaydet
                                </button>
                            )}
                        </div>
                        <div className="flex flex-col md:flex-row gap-4 items-end md:items-center w-full md:w-auto">
                            <div className="relative">
                                <Search size={16} className="absolute left-2 top-2.5 text-forest-400" />
                                <input 
                                    type="text" 
                                    placeholder="Personel Ara..." 
                                    disabled={isSaving || !!savePromiseRef.current}
                                    className="bg-forest-900 border border-forest-500 rounded p-1.5 pl-8 text-sm text-white w-48 focus:ring-1 focus:ring-forest-400 outline-none disabled:opacity-50" 
                                    value={searchName || ''} 
                                    onChange={(e) => setSearchName(e.target.value)} 
                                />
                                {searchName && (
                                    <button onClick={() => setSearchName(null)} className="absolute right-2 top-2.5 text-forest-400 hover:text-white">
                                        <X size={14} />
                                    </button>
                                )}
                            </div>
                            <div className="flex flex-col">
                                <label className="text-[10px] text-forest-400 uppercase font-bold">Tarih Aralığı</label>
                                <div className="flex items-center gap-1">
                                    <input type="date" value={rangeStartDate} onChange={(e) => {
                                        const newStart = e.target.value;
                                        if (hasUnsavedChanges) {
                                            save(true);
                                        }
                                        setRangeStartDate(newStart);
                                    }} className="bg-forest-900 text-white p-1 rounded border border-forest-500 text-sm w-28" />
                                    <span className="text-forest-500">-</span>
                                    <input type="date" value={rangeEndDate} onChange={(e) => {
                                        const newEnd = e.target.value;
                                        if (hasUnsavedChanges) {
                                            save(true);
                                        }
                                        setRangeEndDate(newEnd);
                                    }} className="bg-forest-900 text-white p-1 rounded border border-forest-500 text-sm w-28" />
                                </div>
                            </div>
                            <Button variant="secondary" onClick={handleBackToDashboard} className="h-9">EKRANA DÖN</Button>
                        </div>
                    </div>
                    {rangeStartDate !== rangeEndDate && (<div className="bg-blue-900/40 border border-blue-700 p-3 rounded-lg flex items-center text-blue-200 text-sm mb-4 animate-fade-in"><strong>DİKKAT:</strong> Seçtiğiniz durumlar {rangeStartDate} ile {rangeEndDate} arasındaki TÜM GÜNLERE uygulanacaktır.</div>)}
                    <Card title="Personel Listesi">
                         <div className="relative">
                             <div className="grid gap-4">
                                {[...pilots, ...others].map((p, i) => renderPersonRow(p, i))}
                            </div>
                        </div>
                    </Card>
                  
                    <div className="sticky bottom-0 bg-forest-950 p-4 border-t border-forest-700 flex flex-col items-center gap-2 mt-4 z-40">
                        {saveVerifiedMsg && (
                            <div className="w-full max-w-md p-2.5 rounded-lg text-sm text-center flex items-center justify-center gap-2 font-medium shadow-lg animate-fade-in bg-emerald-600 text-white border border-emerald-400">
                                <CheckCircle2 size={18} />
                                <span>{saveVerifiedMsg}</span>
                            </div>
                        )}
                        <Button 
                            size="lg" 
                            onClick={() => save(false)} 
                            disabled={isSaving}
                            className={`w-full max-w-md flex items-center justify-center gap-2 font-bold transition-all duration-300 ${
                                hasUnsavedChanges 
                                    ? 'bg-amber-500 hover:bg-amber-600 text-black shadow-[0_0_20px_rgba(245,158,11,0.5)] border-2 border-amber-300 animate-pulse' 
                                    : 'bg-emerald-600 hover:bg-emerald-500 text-white'
                            }`}
                        >
                            {isSaving ? (
                                <>
                                    <LucideIcons.RefreshCw size={18} className="animate-spin" />
                                    <span>E-Tabloya Kaydediliyor...</span>
                                </>
                            ) : autoSaveCountdown !== null ? (
                                <>
                                    <Save size={18} />
                                    <span>KAYDET ({autoSaveCountdown}s Sonra Otomatik Kaydedilecek)</span>
                                </>
                            ) : (
                                <>
                                    <Save size={18} />
                                    <span>KAYDET</span>
                                </>
                            )}
                        </Button>
                    </div>
                    <div className="h-20" />
                    
                    {showSyncModal && (
                        <div className="fixed inset-0 bg-black/70 z-[100] flex items-center justify-center p-4 backdrop-blur-sm animate-fade-in">
                            <div className={`bg-forest-900 border border-forest-500 p-8 rounded-2xl ${showSyncDetails ? 'max-w-2xl' : 'max-w-md'} w-full shadow-2xl transition-all duration-300`}>
                                <div className="text-center">
                                    <div className="w-20 h-20 bg-forest-800 rounded-full flex items-center justify-center mx-auto mb-6 border-2 border-forest-400">
                                        <LucideIcons.RefreshCw size={40} className={`text-forest-400 ${isSyncing ? 'animate-spin' : ''}`} />
                                    </div>
                                    <h3 className="text-2xl font-bold text-white mb-2">Fazla Mesai Aktarımı</h3>
                                    <p className="text-forest-200 mb-6 leading-relaxed">
                                        Fazla mesai sisteminde onaylanmış <span className="font-bold text-forest-400">{syncOvertimeCount}</span> adet veri bulundu. 
                                        Bu veriler yoklama sistemine aktarılsın mı?
                                    </p>
                                </div>

                                {showSyncDetails && (
                                    <div className="bg-forest-950 border border-forest-800 rounded-lg p-4 mb-6 max-h-60 overflow-y-auto text-left">
                                        <table className="w-full text-xs text-forest-200">
                                            <thead className="border-b border-forest-800 text-forest-400 uppercase font-bold text-[10px]">
                                                <tr>
                                                    <th className="py-2 text-left w-8"></th>
                                                    <th className="py-2 text-left">Personel</th>
                                                    <th className="py-2 text-left">Tarih</th>
                                                    <th className="py-2 text-left">Durum</th>
                                                    <th className="py-2 text-left">Not</th>
                                                </tr>
                                            </thead>
                                            <tbody>
                                                {syncOvertimeRecords.map((r, idx) => {
                                                    const person = allPersonnel.find(p => {
                                                        const pid = String(p.id).toLowerCase().trim();
                                                        const rid = String(r.personId).toLowerCase().trim();
                                                        return pid === rid || (p.tcNo && String(p.tcNo).trim() === rid);
                                                    });
                                                    const isSkipped = skippedRecordIds.has(r.id);
                                                    const displayName = person ? person.fullName : (r.personName || (r.personId ? `ID: ${r.personId}` : 'Bilinmeyen'));
                                                    return (
                                                        <tr key={idx} className={`border-b border-forest-900/50 hover:bg-forest-900/40 ${isSkipped ? 'opacity-40 grayscale' : ''}`}>
                                                            <td className="py-2">
                                                                <input 
                                                                    type="checkbox" 
                                                                    checked={!isSkipped} 
                                                                    onChange={() => {
                                                                        const newSkipped = new Set(skippedRecordIds);
                                                                        if (isSkipped) newSkipped.delete(r.id);
                                                                        else newSkipped.add(r.id);
                                                                        setSkippedRecordIds(newSkipped);
                                                                    }} 
                                                                    className="w-4 h-4 rounded border-forest-600 bg-forest-800 text-forest-500 focus:ring-forest-500"
                                                                />
                                                            </td>
                                                            <td className="py-2 font-medium text-white">{displayName}</td>
                                                            <td className="py-2">{r.date ? new Date(r.date.replace(/-/g, '/')).toLocaleDateString('tr-TR') : '-'}</td>
                                                            <td className="py-2 text-[11px] leading-tight text-forest-100">{r.status} {r.leaveType ? `(${r.leaveType})` : ''}</td>
                                                            <td className="py-2 max-w-[120px] truncate">{r.note}</td>
                                                        </tr>
                                                    );
                                                })}
                                            </tbody>
                                        </table>
                                    </div>
                                )}

                                <div className="flex flex-col gap-3">
                                    <div className="flex gap-4">
                                        <Button variant="secondary" onClick={() => setShowSyncModal(false)} className="flex-1" disabled={isSyncing}>
                                            Daha Sonra
                                        </Button>
                                        <Button variant="primary" onClick={handleSyncOvertime} className="flex-1" disabled={isSyncing}>
                                            {isSyncing ? 'Aktarılıyor...' : 'Evet, Aktar'}
                                        </Button>
                                    </div>
                                    <button 
                                        onClick={() => setShowSyncDetails(!showSyncDetails)}
                                        className="text-xs text-forest-400 hover:text-white transition-colors underline underline-offset-4"
                                    >
                                        {showSyncDetails ? 'Detayları Gizle' : 'Detayları İncele'}
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {detailModalOpen && detailPerson && (
                        <div className="fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-4 overflow-auto">
                            <div className="bg-forest-900 border border-forest-600 w-full max-w-4xl rounded-lg shadow-2xl flex flex-col max-h-[90vh]">
                                <div className="p-4 border-b border-forest-700 flex justify-between items-center bg-forest-950"><div><h3 className="text-xl font-bold text-white">{detailPerson.fullName}</h3><p className="text-sm text-forest-400">Detaylı Günlük Giriş</p></div><button onClick={() => { setDetailModalOpen(false); setDetailPerson(null) }}><X size={24} className="text-forest-400 hover:text-white" /></button></div>
                                <div className="p-4 overflow-y-auto flex-1 space-y-3">{Object.keys(detailDays).sort().map(dStr => {
                                    const dateObjArr = dStr.split('-').map(Number);
                                    const noonDate = new Date(dateObjArr[0], dateObjArr[1]-1, dateObjArr[2], 12,0,0);
                                    return (
                                        <div key={dStr} className={`p-3 rounded border ${noonDate.getDay() === 0 || noonDate.getDay() === 6 ? 'bg-forest-800/30 border-forest-700' : 'bg-forest-950/30 border-forest-800'} flex flex-col lg:flex-row items-center gap-4`}>
                                            <div className="w-full lg:w-32 flex-shrink-0 text-center lg:text-left">
                                                <div className="font-bold text-white">{noonDate.toLocaleDateString('tr-TR')}</div>
                                                <div className="text-xs text-forest-400 uppercase">{noonDate.toLocaleDateString('tr-TR', { weekday: 'long' })}</div>
                                            </div>
                                            <div className="flex-1 w-full">
                                                <AttendanceControl 
                                                    personId={dStr} 
                                                    state={detailDays[dStr]} 
                                                    onChangeStatus={(id, s) => handleModalStatusChange(id, s)} 
                                                    onChangeDetail={(id, f, v) => handleModalDayChange(id, f, v)} 
                                                    isWeekend={noonDate.getDay() === 0 || noonDate.getDay() === 6}
                                                    allAttendance={allRecs}
                                                />
                                            </div>
                                        </div>
                                    )
                                })}</div>
                                <div className="p-4 border-t border-forest-700 bg-forest-950 flex justify-end gap-2">
                                    <Button variant="secondary" onClick={() => { setDetailModalOpen(false); setDetailPerson(null) }} disabled={isSaving}>İptal</Button>
                                    <Button onClick={saveModal} disabled={isSaving} className="flex items-center gap-2">
                                        {isSaving ? (
                                            <>
                                                <LucideIcons.RefreshCw size={16} className="animate-spin" />
                                                <span>Kaydediliyor...</span>
                                            </>
                                        ) : (
                                            <span>Kaydet</span>
                                        )}
                                    </Button>
                                </div>
                            </div>
                        </div>
                    )}

                    {hoverPhoto && (
                        <div 
                            className="fixed z-[9999] pointer-events-none border-2 border-forest-500 rounded-lg shadow-[0_0_30px_rgba(0,0,0,0.8)] overflow-hidden animate-fade-in bg-forest-900 flex items-center justify-center"
                            style={{ 
                                left: mousePos.x + 20, 
                                top: Math.min(mousePos.y + 20, window.innerHeight - 200),
                                width: '180px',
                                height: '180px'
                            }}
                        >
                            <SafeImage src={hoverPhoto.url} personId={hoverPhoto.personId} className="personnel-photo-square rounded-md" />
                        </div>
                    )}
                </div>
            );
        };

        const Login = ({ onLogin }) => {
            const [u, setU] = useState(''); const [p, setP] = useState('');
            const handleSubmit = (e) => { e.preventDefault(); if (u === 'ogm' && p === '1839') onLogin(); };
            return (<div className="flex items-center justify-center min-h-[50vh]"><Card title="Yönetici Girişi" className="w-full max-w-md"><form onSubmit={handleSubmit} className="space-y-4"><input type="text" placeholder="Kullanıcı" className="w-full bg-forest-950 border border-forest-700 rounded p-2 text-white" value={u} onChange={e => setU(e.target.value)} /><input type="password" placeholder="Şifre" className="w-full bg-forest-950 border border-forest-700 rounded p-2 text-white" value={p} onChange={e => setP(e.target.value)} /><Button type="submit" className="w-full">Giriş Yap</Button></form></Card></div>);
        };

        const App = () => {
            const [view, setView] = useState('attendance');
            const [isAuthenticated, setIsAuthenticated] = useState(false);
            const [isMobile, setIsMobile] = useState(() => typeof window !== 'undefined' && (window.innerWidth < 768 || /iPhone|iPad|iPod|Android/i.test(navigator.userAgent)));
            const [curtainOpen, setCurtainOpen] = useState(isMobile);
            const [curtainHidden, setCurtainHidden] = useState(isMobile);

            useEffect(() => {
                const checkMobile = () => setIsMobile(window.innerWidth < 768 || /iPhone|iPad|iPod|Android/i.test(navigator.userAgent));
                window.addEventListener('resize', checkMobile);
                return () => window.removeEventListener('resize', checkMobile);
            }, []);

            useEffect(() => {
                if (isMobile) {
                    setCurtainOpen(true);
                    setCurtainHidden(true);
                    return;
                }
                const timer = setTimeout(() => { 
                    setCurtainOpen(true); 
                    setTimeout(() => setCurtainHidden(true), 700); 
                }, 1000); 
                return () => clearTimeout(timer); 
            }, [isMobile]);

            const handleLoginSuccess = () => { setIsAuthenticated(true); setView('admin'); };
            const handleLogout = () => { setIsAuthenticated(false); setView('attendance'); };
            return (
                <div className="min-h-screen pb-10">
                    {!isMobile && (
                        <div id="curtain" className={`fixed top-0 left-0 w-full h-full bg-forest-800 z-[9999] flex flex-col items-center justify-center transition-transform duration-700 ease-in-out ${curtainOpen ? '-translate-y-full' : 'translate-y-0'} ${curtainHidden ? 'hidden' : ''}`}>
                            <div className="w-96 h-96 rounded-full overflow-hidden border-8 border-forest-400 shadow-[0_0_40px_rgba(0,0,0,0.6)] mb-8"><img src="https://media4.giphy.com/media/v1.Y2lkPTc5MGI3NjExNW9uenhqZXdxbGd6YWNxc2UwempmOXNyaG15NGtuZTJmb3EyaTNqZCZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9cw/1rrxPs1nb3IjwmbiXw/giphy.gif" className="w-full h-full object-cover" alt="Loading" /></div>
                            <h1 className="text-5xl md:text-6xl font-bold text-white tracking-wider text-center px-4">UÇUŞ İŞLETME VE EĞİTİM ŞUBE YOKLAMA</h1>
                        </div>
                    )}
                    {view === 'attendance' && (<div className="relative"><AttendanceView /><div className="fixed top-4 right-4 z-50"><button onClick={() => setView('login')} className="bg-forest-600 hover:bg-forest-500 text-white px-3 py-1.5 text-xs rounded-full border border-forest-500 shadow-md flex items-center gap-1.5 transition-all font-bold tracking-wide"><Settings size={14} /><span>Yönetici Paneli</span></button></div></div>)}
                    {view === 'login' && (<div className="container mx-auto p-4 animate-fade-in"><button onClick={() => setView('attendance')} className="mb-4 text-forest-400 hover:text-white flex items-center gap-2"><ArrowUp className="rotate-[-90deg]" size={16} /> Geri Dön</button><Login onLogin={handleLoginSuccess} /></div>)}
                    {view === 'admin' && (isAuthenticated ? (<AdminPanel onLogout={handleLogout} />) : (<Login onLogin={handleLoginSuccess} />))}
                </div>
            );
        };

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
