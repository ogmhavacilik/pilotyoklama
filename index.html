                                        <button onClick={() => setAcForm({ ...acForm, cat: AircraftCategory.HELICOPTER })} className={`flex-1 py-1 text-xs border ${acForm.cat === AircraftCategory.HELICOPTER ? 'bg-forest-500' : 'bg-forest-800'}`}>Helikopter</button>
                                        <button onClick={() => setAcForm({ ...acForm, cat: AircraftCategory.PLANE })} className={`flex-1 py-1 text-xs border ${acForm.cat === AircraftCategory.PLANE ? 'bg-forest-500' : 'bg-forest-800'}`}>Uçak</button>
                                    </div>
                                    <input placeholder="Kuyruk No" className="w-full bg-forest-950 border border-forest-700 rounded p-2 text-white" value={acForm.tail} onChange={e => setAcForm({ ...acForm, tail: e.target.value })} />
                                    <select className="w-full bg-forest-950 border border-forest-700 rounded p-2 text-white" value={acForm.city} onChange={e => setAcForm({ ...acForm, city: e.target.value })}>{CITIES.map(c => <option key={c}>{c}</option>)}</select>
                                    <div className="flex gap-2">
                                        <Button onClick={saveAc} className="flex-1">{acForm.id ? 'Güncelle' : 'Ekle'}</Button>
                                        {acForm.id && <Button variant="secondary" onClick={() => { setAcForm({ id: null, model: '', cat: AircraftCategory.HELICOPTER, tail: 'OR-', city: 'Ankara' }); }}>İptal</Button>}
                                    </div>
                                </div>
                            </Card>
                            <Card title="Filo Listesi" className="lg:col-span-2">
                                <div className="overflow-auto max-h-[600px]">
                                    <table className="w-full text-sm text-forest-200">
                                        <thead><tr className="text-left"><th className="p-2">Model</th><th className="p-2">Kuyruk</th><th className="p-2">Bölge</th><th className="p-2 text-right">İşlem</th></tr></thead>
                                        <tbody>
                                            {acList.map(a => (
                                                <tr key={a.id} className="border-b border-forest-700 hover:bg-forest-700/50 cursor-pointer" onDoubleClick={() => { setAcForm({ id: a.id, model: a.model, cat: a.category, tail: a.tailNumber, city: a.city }); }}>
                                                    <td className="p-2">{a.model}</td>
                                                    <td className="p-2">{a.tailNumber}</td>
                                                    <td className="p-2">{a.city}</td>
                                                    <td className="p-2 text-right">
                                                        <button onClick={(e) => deleteAc(a.id, e)} type="button" className="text-red-400 hover:text-red-300 p-2 relative z-10"><Trash2 size={16} /></button>
                                                    </td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            </Card>
                        </div>
                    ) : tab === 'personnel' ? (
                        <div className="grid lg:grid-cols-3 gap-6">
                            <Card title={plForm.id ? "Düzenle" : "Ekle"} className="h-fit">
                                <div className="space-y-3">
                                    <input placeholder="Ad Soyad" className="w-full bg-forest-950 border border-forest-700 rounded p-2 text-white" value={plForm.name} onChange={e => setPlForm({ ...plForm, name: e.target.value })} />
                                    <input placeholder="TC NO" className="w-full bg-forest-950 border border-forest-700 rounded p-2 text-white" value={plForm.tcNo} onChange={e => setPlForm({ ...plForm, tcNo: e.target.value })} maxLength={11} />
                                    <select 
                                        className="w-full bg-forest-950 border border-forest-700 rounded p-2 text-white" 
                                        value={manualTitle ? 'OTHER' : (plForm.title || '')} 
                                        onChange={e => {
                                            const val = e.target.value;
                                            let newRole = plForm.role;
                                            const valUpper = val.toLocaleUpperCase('tr-TR');
                                            if (valUpper.includes('PİLOT')) newRole = Role.PILOT;
                                            else if (valUpper.includes('TEKNİSYEN') || valUpper.includes('TEKNİKER') || valUpper.includes('MÜHENDİS')) newRole = Role.TECHNICIAN;
                                            if (val === 'OTHER') { 
                                                setManualTitle(true); 
                                                setPlForm({ ...plForm, title: '', role: newRole });
                                            } else { 
                                                setManualTitle(false); 
                                                setPlForm({ ...plForm, title: val, role: newRole });
                                            }
                                        }}
                                    >
                                        <option value="">Unvan Seç</option>
                                        {PERSONNEL_TITLES.map(t => <option key={t} value={t}>{t}</option>)}
                                        <option value="OTHER">Diğer</option>
                                    </select>
                                    {manualTitle && <input placeholder="Unvan Giriniz" className="w-full bg-forest-950 border border-forest-700 rounded p-2 text-white" value={plForm.title} onChange={e => setPlForm({ ...plForm, title: e.target.value })} />}
                                    <select className="w-full bg-forest-950 border border-forest-700 rounded p-2 text-white" value={plForm.unit || ''} onChange={e => setPlForm({ ...plForm, unit: e.target.value })}>
                                        <option value="">Birim / Uçak Seçimi</option>
                                        {uniqueModels.map(m => <option key={m} value={m}>{m}</option>)}
                                    </select>
                                    <select className="w-full bg-forest-950 border border-forest-700 rounded p-2 text-white" value={plForm.city} onChange={e => setPlForm({ ...plForm, city: e.target.value })}>{CITIES.map(c => <option key={c}>{c}</option>)}</select>
                                    <input type="date" className="w-full bg-forest-950 border border-forest-700 rounded p-2 text-white" value={plForm.start} onChange={e => setPlForm({ ...plForm, start: e.target.value })} />
                                    <div className="flex gap-2">
                                        <Button onClick={savePl} className="flex-1">{plForm.id ? 'Güncelle' : 'Ekle'}</Button>
                                        {plForm.id && <Button variant="secondary" onClick={() => { setPlForm({ id: null, name: '', role: Role.PILOT, city: 'Ankara', title: '', start: new Date().toLocaleDateString('en-CA'), unit: '', photoUrl: '', tcNo: '' }); setManualTitle(false); }}>İptal</Button>}
                                    </div>
                                </div>
                            </Card>
                            <Card title="Personel Listesi (Fotoğraf İçin İsme Çift Tıklayınız)" className="lg:col-span-2">
                                 <div className="flex justify-end gap-2 mb-2">
                                     <Button onClick={exportPersonnelCsv} size="sm" variant="secondary" className="flex items-center gap-2">CSV İndir</Button>
                                 </div>
                                <div className="overflow-auto max-h-[600px]">
                                    <table className="w-full text-sm text-forest-200">
                                        <thead><tr className="text-left"><th className="p-2">Sıra</th><th className="p-2">Ad Soyad</th><th className="p-2">TC NO</th><th className="p-2">Unvan</th><th className="p-2">Birim</th><th className="p-2 text-right">İşlem</th></tr></thead>
                                        <tbody>
                                            {plList.map((p, i) => (
                                                <tr 
                                                    key={p.id} 
                                                    className={`border-b border-forest-700 hover:bg-forest-700/50 cursor-pointer ${p.activeUntil ? 'opacity-50' : ''}`} 
                                                    onClick={() => { 
                                                        setPlForm({ 
                                                            id: p.id, 
                                                            name: p.fullName, 
                                                            role: p.role, 
                                                            city: p.city, 
                                                            title: p.title, 
                                                            start: p.activeFrom || DEFAULT_START_DATE, 
                                                            unit: p.unit || '', 
                                                            photoUrl: p.photoUrl || '', 
                                                            tcNo: p.tcNo || '' 
                                                        }); 
                                                        setManualTitle(!PERSONNEL_TITLES.includes(p.title) && p.title !== ''); 
                                                    }}
                                                    onDoubleClick={() => { 
                                                        setPhotoPerson(p); 
                                                        setPhotoModalOpen(true); 
                                                        setTempPhotoData(null); 
                                                        setZoomLevel(1); 
                                                    }}
                                                >
                                                    <td className="p-2">{i + 1}</td>
                                                    <td className="p-2 flex items-center gap-2">
                                                        {p.fullName} 
                                                        {(p.photoUrl || window.photoCache[p.id]) && <ImageIcon size={14} className="text-forest-400" />}
                                                    </td>
                                                    <td className="p-2">{p.tcNo || '-'}</td>
                                                    <td className="p-2 bg-forest-900/50"><span className="text-xs px-1 rounded bg-forest-800">{getDisplayTitle(p.title, p.role)}</span></td>
                                                    <td className="p-2">{p.unit || '-'}</td>
                                                    <td className="p-2 text-right flex justify-end gap-1">
                                                        <button 
                                                            onClick={(e) => { 
                                                                e.stopPropagation(); 
                                                                setFullAttendanceParams({ 
                                                                    model: null, 
                                                                    start: getTodayString(), 
                                                                    end: getTodayString(), 
                                                                    searchName: p.fullName 
                                                                });
                                                                setShowFullAttendanceModal(true);
                                                            }} 
                                                            title="Yoklamada Göster"
                                                            className="text-forest-400 hover:text-white p-1"
                                                        >
                                                            <Calendar size={16} />
                                                        </button>
                                                        <button onClick={(e) => { e.stopPropagation(); movePl(i, 'up') }}><ArrowUp size={14} /></button>
                                                        <button onClick={(e) => { e.stopPropagation(); movePl(i, 'down') }}><ArrowDown size={14} /></button>
                                                        <button onClick={(e) => { e.stopPropagation(); initiateDeletePerson(p); }} type="button" className="text-red-400 ml-2 hover:bg-forest-800 rounded p-1 relative z-10"><Trash2 size={16} /></button>
                                                    </td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            </Card>
                        </div>
                    ) : (
                        <div className="space-y-6">
                            <Card title="Harcırah Oluşturma">
                                <div className="space-y-4">
                                    <div className="flex items-center gap-4">
                                        <Button onClick={() => setHarcirahStep('started')}>Harcırah Oluştur</Button>
                                        {harcirahStep !== 'initial' && (
                                            <span className="text-forest-400 text-sm">
                                                Seçili İl: <span className="text-white font-bold">{selectedHarcirahCity}</span>
                                                {selectedHarcirahUnit && <> | Birim: <span className="text-white font-bold">{selectedHarcirahUnit}</span></>}
                                            </span>
                                        )}
                                    </div>

                                    {harcirahStep !== 'initial' && (
                                        <div className="grid md:grid-cols-2 gap-6 pt-4 border-t border-forest-700">
                                            <div className="space-y-2">
                                                <label className="text-xs font-bold text-forest-400 uppercase">1. Görev İli Seçiniz</label>
                                                <div className="grid grid-cols-2 gap-2 max-h-48 overflow-y-auto pr-2">
                                                    {availableHarcirahCities.length > 0 ? (
                                                        availableHarcirahCities.map(city => (
                                                            <button 
                                                                key={city} 
                                                                onClick={() => handleHarcirahCitySelect(city)}
                                                                className={`p-2 text-sm rounded border ${selectedHarcirahCity === city ? 'bg-forest-500 border-forest-400 text-white' : 'bg-forest-950 border-forest-700 text-forest-300 hover:border-forest-500'}`}
                                                            >
                                                                {city}
                                                            </button>
                                                        ))
                                                    ) : (
                                                        <div className="col-span-2 text-forest-500 text-xs italic p-4 text-center bg-forest-950/50 rounded border border-forest-800">
                                                            Yoklama kayıtlarında görev yeri girilmiş personel bulunamadı.
                                                        </div>
                                                    )}
                                                </div>
                                            </div>

                                            {selectedHarcirahCity && (
                                                <div className="space-y-2 animate-slide-down">
                                                    <label className="text-xs font-bold text-forest-400 uppercase">2. Birim Seçiniz</label>
                                                    <div className="space-y-2">
                                                        {['BELL-429', 'C-650', 'B-360', 'T-70', 'AT-802', 'İDARİ', 'TEKNİK EKİPLER', 'ŞÖFÖRLER', 'DİĞER', 'TÜM BİRİMLER'].map(cat => {
                                                            const dutyCount = plList.filter(p => {
                                                                if (cat !== 'TÜM BİRİMLER' && getHarcirahCategory(p) !== cat) return false;
                                                                return allAttendance.some(r => isSamePerson(r.personId, p.id) && isDutyRecord(r, selectedHarcirahCity));
                                                            }).length;
                                                            return (
                                                                <button 
                                                                    key={cat} 
                                                                    onClick={() => handleHarcirahUnitSelect(cat)}
                                                                    className={`w-full p-2.5 text-left text-sm rounded-lg border flex justify-between items-center transition-all ${selectedHarcirahUnit === cat ? 'bg-forest-500 border-forest-400 text-white shadow-md' : 'bg-forest-950 border-forest-700 text-forest-300 hover:border-forest-500'}`}
                                                                >
                                                                    <span className="font-semibold">{cat}</span>
                                                                    {dutyCount > 0 ? (
                                                                        <span className="text-[10px] px-2 py-0.5 rounded-full font-bold bg-emerald-950 text-emerald-300 border border-emerald-800">
                                                                            {dutyCount} Personel
                                                                        </span>
                                                                    ) : (
                                                                        <span className="text-[10px] px-2 py-0.5 rounded-full font-medium bg-forest-900/60 text-forest-500 border border-forest-800">
                                                                            0
                                                                        </span>
                                                                    )}
                                                                </button>
                                                            );
                                                        })}
                                                    </div>
                                                </div>
                                            )}
                                        </div>
                                    )}

                                    {harcirahStep === 'unit_selected' && (
                                        <div className="pt-6 border-t border-forest-700 animate-slide-down">
                                            <label className="text-xs font-bold text-forest-400 uppercase block mb-3">3. Görev Ayı Seçiniz</label>
                                            
                                            {availableHarcirahRanges.length > 0 ? (
                                                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
                                                    {availableHarcirahRanges.map((range, idx) => {
                                                        const isSelected = selectedHarcirahRange?.monthKey === range.monthKey;
                                                        return (
                                                            <div key={idx} className="relative">
                                                                <button 
                                                                    onClick={() => handleHarcirahRangeSelect(range)}
                                                                    className={`w-full p-4 rounded-xl border text-left flex justify-between items-center transition-all cursor-pointer ${isSelected ? 'bg-forest-500 border-forest-400 text-white' : 'bg-forest-950 border-forest-700 text-forest-300 hover:border-forest-500'}`}
                                                                >
                                                                    <span className="font-bold text-sm">{range.label}</span>
                                                                    <span className="text-[10px] bg-forest-900 border border-forest-700 px-2 py-0.5 rounded text-forest-200 font-semibold uppercase">Seç</span>
                                                                </button>
                                                            </div>
                                                        );
                                                    })}
                                                </div>
                                            ) : (
                                                <div className="text-forest-500 text-xs italic p-4 text-center bg-forest-950/50 rounded border border-forest-800">
                                                    Bu birim için görev tarihi bulunamadı.
                                                </div>
                                            )}
                                        </div>
                                    )}

                                    {selectedHarcirahRange && (
                                        <div className="pt-6 border-t border-forest-700 animate-slide-down">
                                            <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 mb-4">
                                                <div>
                                                    <h3 className="font-bold text-white text-base">4. Personel Seçimi ({harcirahPersonnel.length} Kişi Bulundu)</h3>
                                                    <p className="text-xs text-forest-400">Görev Ayı: {selectedHarcirahRange.label}</p>
                                                </div>
                                                <div className="flex gap-2 w-full sm:w-auto">
                                                    <Button variant="secondary" size="sm" onClick={addAllHarcirahPersonnel} className="flex-1 sm:flex-none">Tümünü Seç</Button>
                                                    <Button variant="success" size="sm" onClick={exportHarcirahExcel} disabled={selectedHarcirahPersonnelIds.size === 0} className="flex-1 sm:flex-none">
                                                        <LucideIcons.FileSpreadsheet size={16} className="mr-2" /> Şablonu Oluştur (Excel)
                                                    </Button>
                                                </div>
                                            </div>
                                            
                                            <div className="grid md:grid-cols-2 lg:grid-cols-3 gap-4">
                                                {harcirahPersonnel.map(p => {
                                                    const isSelected = selectedHarcirahPersonnelIds.has(p.id);
                                                    const isExpanded = expandedHarcirahPersonIds.has(p.id);
                                                    
                                                    // Load all duty dates of this person in this city across all times, to merge into contiguous blocks
                                                    const allPersonDutyDates = allAttendance.filter(r => 
                                                        isSamePerson(r.personId, p.id) && 
                                                        isDutyRecord(r, selectedHarcirahCity)
                                                    ).map(r => r.date).filter(Boolean).sort();
                                                    
                                                    const allPersonBlocks = getMergedHarcirahBlocks(allPersonDutyDates);
                                                    // Keep only blocks whose majority month is the selected range's monthKey
                                                    const personBlocks = allPersonBlocks.filter(b => 
                                                        getMajorityMonthOfBlock(b) === selectedHarcirahRange.monthKey
                                                    );
                                                    
                                                    // Calculate total days based on either selected dates (if checked) or total block days (if unchecked)
                                                    const displayedDays = (() => {
                                                        if (!isSelected) {
                                                            return personBlocks.reduce((sum, b) => {
                                                                const d1 = new Date(b.start); d1.setHours(12,0,0,0);
                                                                const d2 = new Date(b.end); d2.setHours(12,0,0,0);
                                                                return sum + Math.round((d2 - d1) / (1000 * 60 * 60 * 24)) + 1;
                                                            }, 0);
                                                        }
                                                        const selectedDatesForPerson = Array.from(selectedHarcirahDates[p.id] || []);
                                                        const selectedBlocksForPerson = getMergedHarcirahBlocks(selectedDatesForPerson);
                                                        return selectedBlocksForPerson.reduce((sum, b) => {
                                                            const blockStart = new Date(b.start); blockStart.setHours(12,0,0,0);
                                                            const blockEnd = new Date(b.end); blockEnd.setHours(12,0,0,0);
                                                            return sum + Math.round((blockEnd - blockStart) / (1000 * 60 * 60 * 24)) + 1;
                                                        }, 0);
                                                    })();
                                                    
                                                    return (
                                                        <div 
                                                            key={p.id} 
                                                            className={`rounded-xl border transition-all duration-200 overflow-hidden ${
                                                                isSelected 
                                                                    ? 'bg-forest-900 border-forest-500 shadow-md shadow-forest-950/50' 
                                                                    : 'bg-forest-950 border-forest-800 hover:border-forest-700 opacity-80 hover:opacity-100'
                                                            }`}
                                                        >
                                                            {/* Card Header clickable to toggle expansion */}
                                                            <div 
                                                                onClick={() => {
                                                                    setExpandedHarcirahPersonIds(prev => {
                                                                        const next = new Set(prev);
                                                                        if (next.has(p.id)) {
                                                                            next.delete(p.id);
                                                                        } else {
                                                                            next.add(p.id);
                                                                        }
                                                                        return next;
                                                                    });
                                                                }}
                                                                className="p-4 flex items-center justify-between cursor-pointer select-none hover:bg-forest-800/25 transition-all"
                                                            >
                                                                <div className="flex items-center space-x-3 flex-1 min-w-0">
                                                                    {/* Select/Deselect checkbox */}
                                                                    <div 
                                                                        onClick={(e) => {
                                                                            e.stopPropagation();
                                                                            toggleHarcirahPerson(p.id);
                                                                        }}
                                                                        className={`w-5 h-5 rounded-md border flex items-center justify-center transition-all cursor-pointer shrink-0 ${
                                                                            isSelected ? 'bg-green-600 border-green-500 text-white' : 'border-forest-600 hover:border-forest-400 bg-forest-950/50'
                                                                        }`}
                                                                    >
                                                                        {isSelected && <LucideIcons.Check size={14} className="stroke-[3]" />}
                                                                    </div>
                                                                    <div className="min-w-0">
                                                                        <div className="text-sm font-bold text-white tracking-wide truncate">{p.fullName}</div>
                                                                        <div className="text-[10px] text-forest-400 uppercase tracking-widest truncate mt-0.5">
                                                                            {getDisplayTitle(p.title, p.role)}
                                                                        </div>
                                                                    </div>
                                                                </div>
                                                                
                                                                <div className="flex items-center space-x-2 shrink-0 ml-2">
                                                                    <span className={`text-xs px-2 py-0.5 rounded font-bold ${
                                                                        isSelected ? 'bg-forest-950 text-forest-200 border border-forest-700' : 'bg-forest-950/80 text-forest-500 border border-forest-900/60'
                                                                    }`}>
                                                                        {displayedDays} GÜN
                                                                    </span>
                                                                    {isExpanded ? (
                                                                        <LucideIcons.ChevronUp size={18} className="text-forest-400" />
                                                                    ) : (
                                                                        <LucideIcons.ChevronDown size={18} className="text-forest-400" />
                                                                    )}
                                                                </div>
                                                            </div>

                                                            {/* Collapsible area showing individual tasks stack one below another */}
                                                            {isExpanded && (
                                                                <div className="p-4 bg-forest-950/60 border-t border-forest-800/40 animate-slide-down space-y-3">
                                                                    <div className="flex justify-between items-center mb-1">
                                                                        <span className="text-[10px] font-bold text-forest-400 uppercase tracking-widest">GÖREV GİRİŞLERİ</span>
                                                                        <button 
                                                                            onClick={(e) => { 
                                                                                e.stopPropagation(); 
                                                                                const personUnit = (pers) => {
                                                                                    const unitOrder = ["BELL-429", "C-650", "B-360", "T-70", "AT-802", "İDARİ"];
                                                                                    if (pers.unit && unitOrder.includes(pers.unit)) return pers.unit;
                                                                                    if (pers.unit === 'İDARİ BİRİM' || pers.unit === 'TEKNİK EKİP' || pers.unit === 'YER DESTEK') return "İDARİ";
                                                                                    const titleUpper = (pers.title || '').toLocaleUpperCase('tr-TR');
                                                                                    if (titleUpper.includes('BELL')) return "BELL-429";
                                                                                    if (titleUpper.includes('C-650')) return "C-650";
                                                                                    if (titleUpper.includes('B-360')) return "B-360";
                                                                                    if (titleUpper.includes('T-70')) return "T-70";
                                                                                    if (titleUpper.includes('AT-802')) return "AT-802";
                                                                                    return "İDARİ";
                                                                                };
                                                                                setFullAttendanceParams({ 
                                                                                    model: personUnit(p), 
                                                                                    start: selectedHarcirahRange.start, 
                                                                                    end: selectedHarcirahRange.end, 
                                                                                    searchName: p.fullName 
                                                                                });
                                                                                setShowFullAttendanceModal(true);
                                                                            }}
                                                                            className="flex items-center space-x-1 text-[10px] text-orange-400 hover:text-orange-300 transition-colors uppercase font-bold"
                                                                        >
                                                                            <LucideIcons.Calendar size={12} />
                                                                            <span>Yoklama Göster</span>
                                                                        </button>
                                                                    </div>

                                                                    {personBlocks.length > 0 ? (
                                                                        <div className="space-y-3">
                                                                            {personBlocks.map((block, bIdx) => {
                                                                                const d1 = new Date(`${block.start}T12:00:00`);
                                                                                const d2 = new Date(`${block.end}T12:00:00`);
                                                                                const blockDays = Math.round((d2 - d1) / (1000 * 60 * 60 * 24)) + 1;
                                                                                
                                                                                const datesInBlock = getDaysInRange(block.start, block.end).map(d => normalizeDate(d));
                                                                                const isBlockSel = datesInBlock.every(d => selectedHarcirahDates[p.id]?.has(d));
                                                                                const spanLabel = getBlockSpanLabel(block, selectedHarcirahRange.monthKey);
                                                                                
                                                                                return (
                                                                                    <div 
                                                                                        key={bIdx}
                                                                                        className="bg-forest-950/30 border border-forest-900 rounded-lg p-3 space-y-3"
                                                                                    >
                                                                                        {/* Block Header Row */}
                                                                                        <div 
                                                                                            onClick={(e) => {
                                                                                                e.stopPropagation();
                                                                                                toggleHarcirahBlock(p.id, block);
                                                                                            }}
                                                                                            className={`p-2.5 rounded-md border text-xs flex justify-between items-center cursor-pointer transition-all ${
                                                                                                isBlockSel 
                                                                                                    ? 'bg-forest-900/40 border-forest-700 text-white font-semibold' 
                                                                                                    : 'bg-forest-950/45 border-forest-900/70 text-forest-400 hover:border-forest-800'
                                                                                            }`}
                                                                                        >
                                                                                            <div className="flex items-center space-x-2.5">
                                                                                                <div className={`w-4.5 h-4.5 rounded border flex items-center justify-center transition-all ${
                                                                                                    isBlockSel ? 'bg-orange-600 border-orange-500 text-white' : 'border-forest-800 bg-forest-950/80'
                                                                                                }`}>
                                                                                                    {isBlockSel && <LucideIcons.Check size={12} className="stroke-[3]" />}
                                                                                                </div>
                                                                                                <div className="flex flex-col">
                                                                                                    <span className="font-bold text-forest-100">
                                                                                                        {d1.toLocaleDateString('tr-TR', { day: 'numeric', month: 'long' })}
                                                                                                    </span>
                                                                                                    <span className="text-[10px] opacity-75">
                                                                                                        - {d2.toLocaleDateString('tr-TR', { day: 'numeric', month: 'long', year: 'numeric' })}
                                                                                                    </span>
                                                                                                    {spanLabel && (
                                                                                                        <span className="text-[10px] text-orange-400 font-semibold italic mt-1">
                                                                                                            {spanLabel}
                                                                                                        </span>
                                                                                                    )}
                                                                                                </div>
                                                                                            </div>
                                                                                            <span className={`text-[10px] px-2 py-0.5 rounded-full font-bold ${
                                                                                                isBlockSel ? 'bg-orange-950 text-orange-300 border border-orange-800/40' : 'bg-forest-950 text-forest-500 border border-forest-900'
                                                                                            }`}>
                                                                                                {blockDays} Gün
                                                                                            </span>
                                                                                        </div>

                                                                                        {/* Kare Takvim (Square Calendar) */}
                                                                                        <div className="space-y-1.5">
                                                                                            <div className="text-[9px] font-extrabold text-forest-400 tracking-wider flex justify-between items-center px-1">
                                                                                                <span>GÜN SEÇİMİ (KARE TAKVİM)</span>
                                                                                                <span className="text-[8px] text-forest-500 font-semibold uppercase italic">(Seçmek veya bırakmak için tıklayın)</span>
                                                                                            </div>
                                                                                            <div className="grid grid-cols-7 sm:grid-cols-8 md:grid-cols-10 gap-1.5">
                                                                                                {datesInBlock.map(dStr => {
                                                                                                    const dObj = new Date(`${dStr}T12:00:00`);
                                                                                                    const dayNum = dObj.getDate();
                                                                                                    const monthName = dObj.toLocaleDateString('tr-TR', { month: 'short' });
                                                                                                    const isSameMonth = dStr.startsWith(selectedHarcirahRange.monthKey);
                                                                                                    const isDateSelected = selectedHarcirahDates[p.id]?.has(dStr);
                                                                                                    
                                                                                                    let cellClass = "";
                                                                                                    if (isDateSelected) {
                                                                                                        if (isSameMonth) {
                                                                                                            cellClass = "bg-green-600 border-green-500 text-white font-black hover:bg-green-500 active:scale-95 shadow-[0_0_8px_rgba(22,163,74,0.3)]";
                                                                                                        } else {
                                                                                                            cellClass = "bg-orange-600 border-orange-500 text-white font-black hover:bg-orange-500 active:scale-95 shadow-[0_0_8px_rgba(234,88,12,0.3)]";
                                                                                                        }
                                                                                                    } else {
                                                                                                        cellClass = "bg-forest-950/60 border-forest-900 text-forest-500 hover:text-forest-300 hover:bg-forest-900/40 hover:border-forest-750";
                                                                                                    }
                                                                                                    
                                                                                                    return (
                                                                                                        <button
                                                                                                            key={dStr}
                                                                                                            type="button"
                                                                                                            onClick={(e) => {
                                                                                                                e.stopPropagation();
                                                                                                                toggleHarcirahDate(p.id, dStr);
                                                                                                            }}
                                                                                                            className={`aspect-square rounded-md border flex flex-col items-center justify-center p-1 transition-all text-center select-none cursor-pointer ${cellClass}`}
                                                                                                            title={dObj.toLocaleDateString('tr-TR', { day: 'numeric', month: 'long', year: 'numeric' })}
                                                                                                        >
                                                                                                            <span className="text-xs tracking-tight font-extrabold leading-none">{dayNum}</span>
                                                                                                            <span className="text-[7.5px] uppercase tracking-wider opacity-85 mt-0.5 leading-none font-bold">{monthName}</span>
                                                                                                        </button>
                                                                                                    );
                                                                                                })}
                                                                                            </div>
                                                                                        </div>
                                                                                    </div>
                                                                                );
                                                                            })}
                                                                        </div>
                                                                    ) : (
                                                                        <div className="text-center text-[10px] text-forest-500 italic py-2">
                                                                            Bu ayda görev kaydı bulunmamaktadır.
                                                                        </div>
                                                                    )}
                                                                </div>
                                                            )}
                                                        </div>
                                                    );
                                                })}
                                            </div>
                                        </div>
                                    )}
                                </div>
                            </Card>
                        </div>
                    )}

                    {photoModalOpen && photoPerson && (
                        <div className="fixed inset-0 bg-black/80 flex items-center justify-center z-[100] p-4">
                            <Card title="Gelişmiş Fotoğraf Yönetimi" className="w-full max-w-md animate-slide-down">
                                <div className="flex flex-col items-center gap-6">
                                    <div 
                                        onPaste={handlePaste}
                                        onDragOver={(e) => e.preventDefault()}
                                        onDrop={handleDrop}
                                        className="relative w-48 h-64 bg-forest-950 border-2 border-dashed border-forest-600 rounded-lg flex flex-col items-center justify-center overflow-hidden group hover:border-forest-400 transition-all cursor-pointer"
                                    >
                                        {tempPhotoData ? (
                                            <img 
                                                src={tempPhotoData} 
                                                className="w-full h-full object-cover transition-transform duration-200" 
                                                style={{ transform: `scale(${zoomLevel})` }}
                                            />
                                        ) : (photoPerson.photoUrl || window.photoCache[photoPerson.id]) ? (
                                            <SafeImage src={photoPerson.photoUrl} personId={photoPerson.id} className="w-full h-full object-cover transition-transform duration-200" style={{ transform: `scale(${zoomLevel})` }} />
                                        ) : (
                                            <div className="text-center p-4">
                                                <Upload size={32} className="mx-auto mb-2 text-forest-600" />
                                                <p className="text-xs text-forest-500">Excel'den Kopyala-Yapıştır<br/>veya Dosya Sürükle</p>
                                            </div>
                                        )}
                                        {loading && <div className="absolute inset-0 bg-black/50 flex items-center justify-center"><Loader2 className="animate-spin text-white" /></div>}
                                    </div>
                                    <div className="w-full text-center space-y-4">
                                        <div>
                                            <div className="text-xl font-bold text-white">{photoPerson.fullName}</div>
                                            <div className="text-sm text-forest-400 uppercase tracking-widest">{getDisplayTitle(photoPerson.title, photoPerson.role)}</div>
                                        </div>
                                        <div className="space-y-2">
                                            <label className="text-xs text-forest-400 block">Yakınlaştırma / Kırpma Ayarı</label>
                                            <input type="range" min="1" max="3" step="0.1" value={zoomLevel} onChange={(e) => setZoomLevel(parseFloat(e.target.value))} className="w-full accent-forest-500 h-1.5 bg-forest-950 rounded-lg appearance-none cursor-pointer" />
                                        </div>
                                        <div className="grid grid-cols-1 gap-3">
                                            {/* 2) DRIVE GÜNCELLE Butonu (Zoom veya yeni yükleme varsa) */}
                                            {(zoomLevel > 1 || tempPhotoData) && (
                                                <button 
                                                    onClick={handleUpdateDriveWithCrop}
                                                    className="bg-green-600 hover:bg-green-500 text-white text-sm font-bold py-3 rounded flex items-center justify-center gap-2 transition-all shadow-xl animate-pulse"
                                                >
                                                    <LucideIcons.Save size={18} /> DRIVE GÜNCELLE
                                                </button>
                                            )}
                                            
                                            <div className="grid grid-cols-2 gap-2">
                                                <label className="bg-blue-600 hover:bg-blue-500 text-white text-sm font-bold py-2.5 rounded flex items-center justify-center gap-2 cursor-pointer transition-all shadow-lg active:scale-95">
                                                    <Upload size={16} /> Dosyadan Seç
                                                    <input type="file" className="hidden" accept="image/*" onChange={handleFileUpload} />
                                                </label>
                                                <button 
                                                    disabled={!photoPerson.photoUrl}
                                                    onClick={() => handlePhotoAction('delete_photo')}
                                                    className="bg-red-900/50 hover:bg-red-700 text-red-100 text-sm font-bold py-2.5 rounded flex items-center justify-center gap-2 transition-all disabled:opacity-30 border border-red-800 shadow-lg active:scale-95"
                                                >
                                                    <Trash2 size={16} /> Sil
                                                </button>
                                            </div>
                                            <Button variant="secondary" onClick={() => { setPhotoModalOpen(false); setPhotoPerson(null); setZoomLevel(1); setTempPhotoData(null); }} className="w-full">Pencereyi Kapat</Button>
                                        </div>
                                    </div>
                                </div>
                            </Card>
                        </div>
                    )}

                    {deleteModalOpen && personToDelete && (
                        <div className="fixed inset-0 bg-black/70 flex items-center justify-center z-50">
                            <div className="bg-forest-900 border border-forest-600 p-6 rounded-lg max-w-md w-full shadow-2xl">
                                <h3 className="text-xl font-bold text-white mb-2">Personel İşten Çıkarma</h3>
                                <p className="text-forest-300 text-sm mb-4"><span className="font-bold text-white">{personToDelete.fullName}</span></p>
                                <div className="mb-4">
                                    <label className="block text-xs uppercase text-forest-400 font-bold mb-1">Çıkış Tarihi</label>
                                    <input type="date" className="w-full bg-forest-950 border border-forest-700 rounded p-2 text-white" value={terminationDate} onChange={(e) => setTerminationDate(e.target.value)} />
                                </div>
                                <div className="flex flex-col gap-3">
                                    <Button variant="danger" type="button" onClick={terminatePerson} className="w-full"><UserMinus className="mr-2" size={16} /> İşten Çıkar (Arşivle)</Button>
                                    <Button variant="secondary" type="button" onClick={hardDeletePerson} className="w-full bg-red-900/30 text-red-300 border-red-900/50"><Trash2 className="mr-2" size={16} /> Kaydı Tamamen Sil</Button>
                                    <Button variant="secondary" type="button" onClick={() => { setDeleteModalOpen(false); setPersonToDelete(null); }} className="w-full mt-2">İptal</Button>
                                </div>
                            </div>
                        </div>
                    )}

                    {attendancePreviewModalOpen && (
                        <div className="fixed inset-0 bg-black/80 flex items-center justify-center z-[60] p-4 backdrop-blur-sm">
                            <div className="bg-forest-900 border border-forest-600 rounded-xl max-w-5xl w-full max-h-[90vh] flex flex-col shadow-2xl overflow-hidden animate-in fade-in zoom-in duration-200">
                                <div className="p-4 border-b border-forest-700 flex justify-between items-center bg-forest-800/50">
                                    <div>
                                        <h3 className="text-lg font-bold text-white uppercase tracking-tight">Yoklama Önizleme</h3>
                                        <p className="text-xs text-forest-400 font-medium">
                                            {selectedHarcirahUnit} | {selectedHarcirahCity} | {attendancePreviewData.range && new Date(attendancePreviewData.range.start).toLocaleDateString('tr-TR')} - {attendancePreviewData.range && new Date(attendancePreviewData.range.end).toLocaleDateString('tr-TR')}
                                        </p>
                                    </div>
                                    <button 
                                        onClick={() => setAttendancePreviewModalOpen(false)}
                                        className="p-2 hover:bg-forest-700 rounded-full text-forest-400 hover:text-white transition-colors"
                                    >
                                        <LucideIcons.X size={24} />
                                    </button>
                                </div>
                                <div className="flex-1 overflow-auto p-4 custom-scrollbar">
                                    <table className="w-full text-xs text-forest-200 border-collapse">
                                        <thead className="sticky top-0 bg-forest-900 z-10 shadow-sm">
                                            <tr>
                                                <th className="p-2 text-left border border-forest-700 bg-forest-800/80">Personel</th>
                                                {(() => {
                                                    if (!attendancePreviewData.range) return null;
                                                    const dates = [];
                                                    let curr = new Date(attendancePreviewData.range.start);
                                                    const end = new Date(attendancePreviewData.range.end);
                                                    while(curr <= end) {
                                                        dates.push(new Date(curr).toISOString().split('T')[0]);
                                                        curr.setDate(curr.getDate() + 1);
                                                    }
                                                    return dates.map(d => (
                                                        <th key={d} className="p-1 text-center border border-forest-700 bg-forest-800/80 min-w-[40px]">
                                                            <div className="flex flex-col">
                                                                <span className="text-[10px] opacity-70">{new Date(d).toLocaleDateString('tr-TR', { weekday: 'short' })}</span>
                                                                <span>{new Date(d).getDate()}</span>
                                                            </div>
                                                        </th>
                                                    ));
                                                })()}
                                            </tr>
                                        </thead>
                                        <tbody>
                                            {plList
                                                .filter(p => selectedHarcirahUnit === 'TÜM BİRİMLER' || getHarcirahCategory(p) === selectedHarcirahUnit)
                                                .map(p => (
                                                    <tr key={p.id} className="hover:bg-forest-800/30 transition-colors">
                                                        <td className="p-2 border border-forest-700 font-medium sticky left-0 bg-forest-900 z-[5]">{p.fullName}</td>
                                                        {(() => {
                                                            if (!attendancePreviewData.range) return null;
                                                            const dates = [];
                                                            let curr = new Date(attendancePreviewData.range.start);
                                                            const end = new Date(attendancePreviewData.range.end);
                                                            while(curr <= end) {
                                                                dates.push(new Date(curr).toISOString().split('T')[0]);
                                                                curr.setDate(curr.getDate() + 1);
                                                            }
                                                            return dates.map(d => {
                                                                const rec = attendancePreviewData.records.find(r => isSamePerson(r.personId, p.id) && r.date === d);
                                                                let statusColor = "text-forest-600";
                                                                let statusText = "-";
                                                                if (rec) {
                                                                    if (rec.status === AttendanceStatus.DUTY) {
                                                                        statusColor = "text-blue-400 font-bold";
                                                                        statusText = "G";
                                                                    } else if (rec.status === AttendanceStatus.OFF) {
                                                                        statusColor = "text-red-400";
                                                                        statusText = "İ";
                                                                    } else if (rec.status === AttendanceStatus.WEEKEND) {
                                                                        statusColor = "text-forest-500 opacity-50";
                                                                        statusText = "H";
                                                                    }
                                                                }
                                                                return (
                                                                    <td key={d} className={`p-1 text-center border border-forest-700 ${statusColor}`}>
                                                                        {statusText}
                                                                    </td>
                                                                );
                                                            });
                                                        })()}
                                                    </tr>
                                                ))}
                                        </tbody>
                                    </table>
                                </div>
                                <div className="p-4 bg-forest-800/30 border-t border-forest-700 flex justify-end">
                                    <Button onClick={() => setAttendancePreviewModalOpen(false)}>Kapat</Button>
                                </div>
                            </div>
                        </div>
                    )}

                    {showFullAttendanceModal && (
                        <div className="fixed inset-0 bg-black/90 flex items-center justify-center z-[70] p-2 sm:p-4 backdrop-blur-md">
                            <div className="bg-forest-950 border border-forest-600 rounded-xl w-full h-full flex flex-col shadow-2xl overflow-hidden animate-in fade-in zoom-in duration-300">
                                <div className="p-4 border-b border-forest-700 flex justify-between items-center bg-forest-900">
                                    <div className="flex items-center gap-3">
                                        <div className="bg-orange-600 p-2 rounded-lg shadow-lg shadow-orange-900/20">
                                            <Calendar size={20} className="text-white" />
                                        </div>
                                        <div>
                                            <h3 className="text-lg font-bold text-white uppercase tracking-tight">Yoklama Görünümü</h3>
                                            <p className="text-xs text-forest-400 font-medium">
                                                {fullAttendanceParams.model} | {new Date(fullAttendanceParams.start).toLocaleDateString('tr-TR')} - {new Date(fullAttendanceParams.end).toLocaleDateString('tr-TR')}
                                            </p>
                                        </div>
                                    </div>
                                    <button 
                                        onClick={() => setShowFullAttendanceModal(false)}
                                        className="p-2 hover:bg-forest-800 rounded-full text-forest-400 hover:text-white transition-all hover:rotate-90 duration-200"
                                    >
                                        <LucideIcons.X size={28} />
                                    </button>
                                </div>
                                <div className="flex-1 overflow-y-auto relative custom-scrollbar">
                                    <AttendanceView 
                                        initialModel={fullAttendanceParams.model}
                                        initialStartDate={fullAttendanceParams.start}
                                        initialEndDate={fullAttendanceParams.end}
                                        initialSearchName={fullAttendanceParams.searchName}
                                        onSave={(fresh) => setAllAttendance(fresh)}
                                    />
                                </div>
                                <div className="p-3 border-t border-forest-700 bg-forest-900 flex justify-end">
                                    <Button onClick={() => setShowFullAttendanceModal(false)} variant="secondary">Kapat</Button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        // Improved SafeImage Component to handle Proxy Data and 1️⃣ & 2️⃣ Önbellekleme
        const SafeImage = ({ src, personId, className, style }) => {
            const [data, setData] = useState(null);
            const [error, setError] = useState(false);
            const [loading, setLoading] = useState(true);

            useEffect(() => {
                // 1) Kalıcı Gerçeklik: Öncelikle Personel ID tabanlı önbelleğe (RAM) bak
                if (personId && window.photoCache[personId]) {
                    setData(window.photoCache[personId]);
                    setLoading(false);
                    return;
                }

                if (!src) { setLoading(false); return; }

                // data: formatıysa (anlık düzenleme vb.) doğrudan kullan ve cache'le
                if (src.startsWith('data:')) {
                    setData(src);
                    if (personId) window.photoCache[personId] = src;
                    setLoading(false);
                    return;
                }

                const fileIdMatch = src.match(/[-\w]{25,}/);
                if (!fileIdMatch) { setLoading(false); setError(true); return; }
                
                const fileId = fileIdMatch[0];
                
                // fileId tabanlı cache kontrolü
                if (window.photoCache[fileId]) {
                    const cached = window.photoCache[fileId];
                    setData(cached);
                    if (personId) window.photoCache[personId] = cached;
                    setLoading(false);
                    return;
                }

                // Backend'den çek
                storageService.fetchSafeImage(fileId).then(res => {
                    if (res) {
                        setData(res);
                        if (personId) window.photoCache[personId] = res;
                    } else {
                        setError(true);
                    }
                    setLoading(false);
                });
            }, [src, personId]);

            if (loading) return <div className={`flex items-center justify-center bg-forest-950 ${className}`}><Loader2 className="animate-spin text-forest-600" size={16} /></div>;
            if (error || !data) return <div className={`flex items-center justify-center bg-forest-950 ${className}`}><User className="text-forest-700" size={16} /></div>;
            return <img src={data} className={className} style={style} />;
        };

        // AttendanceView Component
        const getTodayString = () => {
            const d = new Date();
            const year = d.getFullYear();
            const month = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        };

        const getDaysInRange = (start, end) => {
            const dates = [];
            const [sY, sM, sD] = start.split('-').map(Number);
            const [eY, eM, eD] = end.split('-').map(Number);
            
            const current = new Date(sY, sM - 1, sD, 12, 0, 0);
            const endObj = new Date(eY, eM - 1, eD, 12, 0, 0);

            while (current <= endObj) {
                dates.push(new Date(current));
                current.setDate(current.getDate() + 1);
            }
            return dates;
        };

        const ReportDialog = ({ type, onClose, personnel, attendance, reportUnit, reportSearch, selectedDate }) => {
            const today = selectedDate || getTodayString();
            const todayObj = new Date(today + 'T12:00:00');
            const isTodayWeekend = todayObj.getDay() === 0 || todayObj.getDay() === 6;

            const unitOrder = ["BELL-429", "C-650", "B-360", "T-70", "AT-802", "İDARİ"];
            const getPUnit = (p) => {
                if (p.unit && unitOrder.includes(p.unit)) return p.unit;
                if (p.unit === 'İDARİ BİRİM' || p.unit === 'TEKNİK EKİP' || p.unit === 'YER DESTEK') return "İDARİ";
                const titleUpper = (p.title || '').toLocaleUpperCase('tr-TR');
                if (titleUpper.includes('BELL')) return "BELL-429";
                if (titleUpper.includes('C-650')) return "C-650";
                if (titleUpper.includes('B-360')) return "B-360";
                if (titleUpper.includes('T-70')) return "T-70";
                if (titleUpper.includes('AT-802')) return "AT-802";
                return "İDARİ";
            };

            const filteredPersonnel = personnel.filter(p => {
                const isSeparated = (p.activeUntil && today > p.activeUntil) || (p.activeFrom && today < p.activeFrom);
                if (isSeparated) return false;

                const unit = getPUnit(p);

                // 1. If searching for a specific person by name, bypass Unit filters
                if (reportSearch && reportSearch.trim() !== '') {
                    const searchLower = reportSearch.toLocaleUpperCase('tr-TR').trim();
                    if (!p.fullName || !p.fullName.toLocaleUpperCase('tr-TR').includes(searchLower)) {
                        return false;
                    }
                    return true;
                }

                // 2. If no name search, apply unit filters
                if (reportUnit && reportUnit !== 'TÜM BİRİMLER') {
                    if (unit !== reportUnit) return false;
                }

                return true;
            });

            const resolvePersonStatus = (p, dateStr, attendanceList) => {
                const r = attendanceList.find(a => a.personId === p.id && a.date === dateStr && a.status && a.status !== '');
                if (r) return r;
                
                const dObj = new Date(dateStr + 'T12:00:00');
                const isWe = dObj.getDay() === 0 || dObj.getDay() === 6;
                const hist = attendanceList
                    .filter(x => x.personId === p.id && x.date < dateStr && x.status && x.status !== '')
                    .sort((a, b) => b.date.localeCompare(a.date))[0];
                
                if (isWe) {
                    return { status: undefined };
                } else {
                    if (hist) {
                        const carryOverStatuses = [AttendanceStatus.PRESENT, AttendanceStatus.DUTY];
                        if (carryOverStatuses.includes(hist.status)) {
                            return {
                                ...hist,
                                leaveType: hist.leaveType || LeaveType.DAILY,
                                dutyType: hist.dutyType || DutyType.PLANNED
                            };
                        } else {
                            return { status: AttendanceStatus.PRESENT };
                        }
                    } else {
                        return { status: AttendanceStatus.PRESENT };
                    }
                }
            };
            
            const Header = () => (
                <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-8 border-b border-forest-500 pb-4 gap-4">
                    <div className="flex items-center gap-4">
                       <div className="bg-orange-600 p-2 sm:p-3 rounded-lg shadow-inner"><LucideIcons.Plane className="text-white w-6 h-6 sm:w-8 sm:h-8" /></div>
                       <div>
                            <h2 className="text-xl sm:text-3xl font-extrabold text-white tracking-tight">
                                {type === 'MESAI' && 'MESAİ DURUMU (GÜNLÜK)'}
                                {type === 'FMİ' && 'FAZLA MESAİ İZNİ (GÜNLÜK)'}
                                {type === 'GÖREV' && 'GÖREV DURUMU (GÜNLÜK)'}
                            </h2>
                            <p className="text-forest-400 text-xs sm:text-sm font-medium">{new Date(today + 'T12:00:00').toLocaleDateString('tr-TR', { day: 'numeric', month: 'long', year: 'numeric', weekday: 'long' })}</p>
                       </div>
                    </div>
