        const INITIAL_PERSONNEL = [];

        // --- UTILS ---
        const fixDriveUrl = (url) => {
            if (!url) return '';
            const driveMatch = url.match(/[-\w]{25,}/);
            if (url.includes('drive.google.com') && driveMatch) {
                return `https://drive.google.com/uc?export=view&id=${driveMatch[0]}`;
            }
            return url;
        };

        // --- SERVICES ---
        const normalizeDate = (d) => {
            if (!d) return '';
            if (d instanceof Date) {
                const year = d.getFullYear();
                const month = String(d.getMonth() + 1).padStart(2, '0');
                const day = String(d.getDate()).padStart(2, '0');
                return `${year}-${month}-${day}`;
            }
            if (typeof d === 'string') {
                let cleaned = d.trim();
                if (cleaned.includes('T')) cleaned = cleaned.split('T')[0].trim();
                if (cleaned.includes(' ')) cleaned = cleaned.split(' ')[0].trim();
                if (/^\d{4}-\d{2}-\d{2}$/.test(cleaned)) return cleaned;
                
                const partsDot = cleaned.split('.');
                if (partsDot.length === 3) {
                    if (partsDot[0].length === 4) {
                        return `${partsDot[0]}-${partsDot[1].padStart(2, '0')}-${partsDot[2].padStart(2, '0')}`;
                    } else if (partsDot[2].length === 4) {
                        return `${partsDot[2]}-${partsDot[1].padStart(2, '0')}-${partsDot[0].padStart(2, '0')}`;
                    }
                }
                const partsSlash = cleaned.split('/');
                if (partsSlash.length === 3) {
                    if (partsSlash[0].length === 4) {
                        return `${partsSlash[0]}-${partsSlash[1].padStart(2, '0')}-${partsSlash[2].padStart(2, '0')}`;
                    } else if (partsSlash[2].length === 4) {
                        return `${partsSlash[2]}-${partsSlash[1].padStart(2, '0')}-${partsSlash[0].padStart(2, '0')}`;
                    }
                }
                const partsDash = cleaned.split('-');
                if (partsDash.length === 3) {
                    if (partsDash[0].length === 4) {
                        return `${partsDash[0]}-${partsDash[1].padStart(2, '0')}-${partsDash[2].padStart(2, '0')}`;
                    } else if (partsDash[2].length === 4) {
                        return `${partsDash[2]}-${partsDash[1].padStart(2, '0')}-${partsDash[0].padStart(2, '0')}`;
                    }
                }
                
                if (cleaned.length >= 10 && /^\d{4}/.test(cleaned)) return cleaned.substring(0, 10);
            }
            return '';
        };

        const normalizeAttendanceStatus = (status) => {
            if (!status) return '';
            const s = String(status).trim().toLocaleUpperCase('tr-TR');
            if (s.includes('MESA') || s.includes('MEVCUT') || s.includes('HAZIR')) return AttendanceStatus.PRESENT;
            if (s.includes('İDARİ İZİN') || s.includes('IDARI IZIN')) return AttendanceStatus.PUBLIC_HOLIDAY;
            if (s.includes('İZİN') || s.includes('IZIN') || s.includes('F.M.İ') || s.includes('FMİ')) return AttendanceStatus.LEAVE;
            if (s.includes('GÖREV') || s.includes('GOREV')) return AttendanceStatus.DUTY;
            if (s.includes('KURS')) return AttendanceStatus.COURSE;
            if (s.includes('RAPOR')) return AttendanceStatus.SICK;
            if (s.includes('HASTANE')) return AttendanceStatus.HOSPITAL;
            if (s.includes('YOK')) return AttendanceStatus.ABSENT;
            if (s.includes('DİĞER') || s.includes('DIGER')) return AttendanceStatus.OTHER;
            return status;
        };

        const getDisplayTitle = (title, role) => {
            if (!title && !role) return '';
            const rawTitle = (title || role || '').toString();
            const t = rawTitle.toLocaleUpperCase('tr-TR');
            
            // 1. Uçuş Teknisyeni Logic (Specific Aircraft Technicians)
            if (t.includes('AT-802') || 
                t.includes('T-70') || 
                t.includes('BELL-429') || 
                t.includes('C-650') || 
                t.includes('B-360')) {
                if (t.includes('TEKNİSYEN') || t.includes('TEKNİKER')) {
                    return 'Uçuş Teknisyeni';
                }
            }
            
            // 2. General Technician/Techniker Logic
            if (t.includes('TEKNİSYEN')) return 'Teknisyen';
            if (t.includes('TEKNİKER')) return 'Tekniker';
            
            // 3. Other roles (e.g., DESTEK MEMUR (ŞÖFÖR)) remain as they are
            return rawTitle;
        };

        const idbStorage = {
            open: () => new Promise((resolve) => {
                if (typeof window === 'undefined' || !window.indexedDB) return resolve(null);
                try {
                    const req = indexedDB.open('ogm_offline_v2', 1);
                    req.onupgradeneeded = (e) => {
                        const db = e.target.result;
                        if (!db.objectStoreNames.contains('data')) {
                            db.createObjectStore('data');
                        }
                    };
                    req.onsuccess = () => resolve(req.result);
                    req.onerror = () => resolve(null);
                } catch(e) { resolve(null); }
            }),
            get: async (key) => {
                try {
                    const db = await idbStorage.open();
                    if (!db) return null;
                    return new Promise((resolve) => {
                        const tx = db.transaction('data', 'readonly');
                        const store = tx.objectStore('data');
                        const req = store.get(key);
                        req.onsuccess = () => resolve(req.result || null);
                        req.onerror = () => resolve(null);
                    });
                } catch(e) { return null; }
            },
            set: async (key, val) => {
                try {
                    const db = await idbStorage.open();
                    if (!db) return;
                    const tx = db.transaction('data', 'readwrite');
                    const store = tx.objectStore('data');
                    store.put(val, key);
                } catch(e) {}
            }
        };

        const fastCache = {
            get: (key, fallback) => {
                try {
                    const d = localStorage.getItem('ogm_fast_' + key);
                    return d ? JSON.parse(d) : fallback;
                } catch (e) {
                    return fallback;
                }
            },
            set: (key, val) => {
                try {
                    if (key === 'attendance' && Array.isArray(val)) {
                        // Keep entire dataset in IndexedDB (no quota limitation)
                        idbStorage.set('attendance', val);
                        // In localStorage, store recent records to prevent QuotaExceededError
                        const recent = val.length > 2000 ? val.slice(-2000) : val;
                        localStorage.setItem('ogm_fast_' + key, JSON.stringify(recent));
                        return;
                    }
                    localStorage.setItem('ogm_fast_' + key, JSON.stringify(val));
                } catch (e) {
                    console.warn('LocalStorage kotası aşıldı, IndexedDB kullanılıyor:', e.message);
                }
            }
        };

        const cachedAircraft = fastCache.get('aircraft', null) || INITIAL_AIRCRAFT;
        const cachedPersonnel = fastCache.get('personnel', null) || INITIAL_PERSONNEL;
        const cachedAttendance = fastCache.get('attendance', null) || [];

        const memoryCache = {
            aircraft: cachedAircraft,
            personnel: cachedPersonnel,
            attendance: cachedAttendance,
            loaded: true,
            preloadPromise: null

        // Try hydrating all records asynchronously from IndexedDB on launch
        idbStorage.get('attendance').then(idbAtt => {
            if (idbAtt && Array.isArray(idbAtt) && idbAtt.length > 0) {
                if (!memoryCache.attendance || memoryCache.attendance.length < idbAtt.length) {
                    memoryCache.attendance = idbAtt;
                }
            }
        });

        const GOOGLE_PUB_CSV_BASE = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRC1KvsWTMDmuk1yKFs3p86ibdsOSYWUNYYdbNp9UN5zRleGUl40hwNL3RukH3hR887JrpgQ8oNwpdO/pub";

        const GOOGLE_SHEET_GIDS = {
            Filo: '1274657481',
            Personel: '417699309',
            Yoklama: '234805897'
        };

        const parseCsvRows = (text) => {
            if (!text) return [];
            const lines = [];
            let row = [];
            let inQuotes = false;
            let currentField = "";
            for (let i = 0; i < text.length; i++) {
                const c = text[i];
                const nextC = text[i + 1];
                if (inQuotes) {
                    if (c === '"' && nextC === '"') {
                        currentField += '"';
                        i++;
                    } else if (c === '"') {
                        inQuotes = false;
                    } else {
                        currentField += c;
                    }
                } else {
                    if (c === '"') {
                        inQuotes = true;
                    } else if (c === ',') {
                        row.push(currentField);
                        currentField = "";
                    } else if (c === '\r') {
                        // ignore CR
                    } else if (c === '\n') {
                        row.push(currentField);
                        currentField = "";
                        if (row.length > 1 || (row.length === 1 && row[0] !== "")) {
                            lines.push(row);
                        }
                        row = [];
                    } else {
                        currentField += c;
                    }
                }
            }
            if (currentField !== "" || row.length > 0) {
                row.push(currentField);
                lines.push(row);
            }
            return lines;
        };

        const csvToObjects = (text) => {
            const rows = parseCsvRows(text);
            if (!rows || rows.length < 2) return [];
            const headers = rows[0].map(h => (h || '').trim());
            return rows.slice(1).map(r => {
                const obj = {};
                headers.forEach((h, idx) => {
                    if (h) obj[h] = (r[idx] !== undefined ? r[idx].trim() : "");
                });
                return obj;
            });
        };

        const fetchPublishedCsvSheet = async (sheetName) => {
            const gid = GOOGLE_SHEET_GIDS[sheetName];
            if (!gid) throw new Error(`Bilinmeyen sayfa adı: ${sheetName}`);
            const url = `${GOOGLE_PUB_CSV_BASE}?output=csv&gid=${gid}&_t=${Date.now()}`;
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 12000);
            try {
                const res = await fetch(url, { signal: controller.signal, cache: 'no-store' });
                clearTimeout(timeoutId);
                if (!res.ok) throw new Error(`CSV Yanıt Hatası ${res.status}: ${sheetName}`);
                const text = await res.text();
                return csvToObjects(text);
            } catch (e) {
                clearTimeout(timeoutId);
                throw e;
            }
        };

        const apiCall = async (action, payload = {}, timeoutMs = 120000, retries = 0) => {
            for (let attempt = 0; attempt <= retries; attempt++) {
                const controller = new AbortController();
                const timeoutId = timeoutMs > 0 ? setTimeout(() => controller.abort("İstek zaman aşımına uğradı"), timeoutMs) : null; 
                try {
                    const response = await fetch(GOOGLE_SCRIPT_URL, {
                        method: 'POST',
                        mode: 'cors',
                        redirect: 'follow',
                        headers: {
                            'Content-Type': 'text/plain;charset=UTF-8',
                        },
                        body: JSON.stringify({ action, ...payload }),
                        signal: controller.signal
                    });
                    if (timeoutId) clearTimeout(timeoutId);

                    if (!response.ok) {
                        throw new Error(`Sunucu Hatası: ${response.status}`);
                    }

                    const rawText = await response.text();
                    let json = null;
                    try {
                        json = JSON.parse(rawText);
                    } catch (e) {
                        if (rawText && rawText.includes("OGM Personel Takip API")) {
                            throw new Error("API hazırlandı, veri bekleniyor");
                        }
                        throw new Error("Geçersiz JSON yanıtı");
                    }

                    if (json) {
                        if (json.success === false) throw new Error(json.error || 'API Error');
                        return json.data !== undefined ? json.data : json;
                    }
                    throw new Error("Sunucudan boş veri yanıtı alındı");
                } catch (error) {
                    if (timeoutId) clearTimeout(timeoutId);
                    const isAbort = error.name === 'AbortError' || (error.message && error.message.includes('aborted'));
                    const errMsg = isAbort ? 'Sunucu bağlantısı zaman aşımına uğradı' : error.message;

                    if (attempt < retries) {
                        console.warn(`apiCall('${action}') deneme ${attempt + 1} başarısız (${errMsg}), tekrar deneniyor...`);
                        await new Promise(r => setTimeout(r, 1000));
                        continue;
                    }
                    console.warn(`apiCall('${action}') sunucu yanıt vermedi, yerel veriler kullanılıyor:`, errMsg);
                    throw new Error(errMsg);
                }
            }
        };

        const storageService = {
            preload: async (targetDate = null) => {
                const activeDate = targetDate || getTodayString();
                if (memoryCache.preloadPromise) return memoryCache.preloadPromise;

                memoryCache.preloadPromise = (async () => {
                    try {
                        // KULLANICI TALEBİ: docs.google.com/spreadsheets/d/e/.../pub?output=csv üzerinden
                        // "Personel", "Yoklama" ve "Filo" verilerini paralel, doğrudan ve ışık hızında çek
                        const [pRes, yRes, fRes] = await Promise.allSettled([
                            fetchPublishedCsvSheet('Personel'),
                            fetchPublishedCsvSheet('Yoklama'),
                            fetchPublishedCsvSheet('Filo')
                        ]);

                        let pData = pRes.status === 'fulfilled' ? pRes.value : null;
                        let yData = yRes.status === 'fulfilled' ? yRes.value : null;
                        let fData = fRes.status === 'fulfilled' ? fRes.value : null;

                        // Eğer CSV çekimi başarısız olursa API yedeğini çağır
                        if (!pData || !yData) {
                            try {
                                const [initRes, attRes] = await Promise.allSettled([
                                    !pData ? apiCall('get_init_data', {}, 15000, 0) : Promise.resolve(null),
                                    !yData ? apiCall('get_attendance', {}, 20000, 0) : Promise.resolve(null)
                                ]);
                                if (!pData && initRes.status === 'fulfilled' && initRes.value?.personnel) {
                                    pData = initRes.value.personnel;
                                }
                                if (!fData && initRes.status === 'fulfilled' && initRes.value?.aircraft) {
                                    fData = initRes.value.aircraft;
                                }
                                if (!yData && attRes.status === 'fulfilled' && Array.isArray(attRes.value)) {
                                    yData = attRes.value;
                                }
                            } catch (fallbackErr) {
                                console.warn('API yedek çağrısı atlandı:', fallbackErr.message);
                            }
                        }

                        if (fData && Array.isArray(fData) && fData.length > 0) {
                            const formattedAC = fData.map(a => ({
                                id: String(a.ID || a.id || ''),
                                model: a.MODEL || a.model || '',
                                category: a.CATEGORY || a.category || AircraftCategory.PLANE,
                                tailNumber: a.TAIL_NUMBER || a.tailNumber || '',
                                city: a.CITY || a.city || 'Ankara'
                            }));
                            memoryCache.aircraft = formattedAC;
                            fastCache.set('aircraft', formattedAC);
                        } else if (!memoryCache.aircraft) {
                            memoryCache.aircraft = fastCache.get('aircraft', INITIAL_AIRCRAFT);
                        }

                        if (pData && Array.isArray(pData) && pData.length > 0) {
                            let formattedPL = pData.map(p => {
                                let foundTc = p['TC NO'] || p.TC_NO || p.tcNo || p.tc_no || p.TC || p.tcno || p.TcNo || '';
                                return {
                                    id: String(p.ID || p.id || ''),
                                    rank: Number(p.RANK || p.rank) || 999,
                                    fullName: String(p.FULL_NAME || p.fullName || '').trim(),
                                    role: p.ROLE || p.role || Role.PILOT,
                                    title: String(p.TITLE || p.title || '').trim(),
                                    city: String(p.CITY || p.city || 'Ankara').trim(),
                                    activeFrom: p.ACTIVE_FROM || p.activeFrom || '',
                                    activeUntil: p.ACTIVE_UNTIL || p.activeUntil || '',
                                    unit: String(p.UNIT || p.unit || '').trim(),
                                    photoUrl: fixDriveUrl(p.PHOTO_URL || p.photoUrl),
                                    tcNo: String(foundTc).trim()
                                };
                            }).filter(p => p.id && p.fullName);

                            INITIAL_PERSONNEL.forEach(initP => {
                                if (!formattedPL.some(p => p.id === initP.id)) {
                                    formattedPL.push(initP);
                                }
                            });
                            formattedPL.sort((a, b) => (a.rank || 999) - (b.rank || 999));
                            memoryCache.personnel = formattedPL;
                            fastCache.set('personnel', formattedPL);
                        } else if (!memoryCache.personnel) {
                            memoryCache.personnel = fastCache.get('personnel', INITIAL_PERSONNEL);
                        }

                        if (yData && Array.isArray(yData) && yData.length > 0) {
                            const formattedAtt = yData.map(r => ({
                                id: String(r.ID || r.id || ''),
                                personId: String(r.PERSON_ID || r.personId || '').trim(),
                                date: normalizeDate(r.DATE || r.date),
                                status: normalizeAttendanceStatus(r.STATUS || r.status),
                                dutyLocation: String(r.DUTY_LOCATION || r.dutyLocation || '').trim(),
                                dutyLocationDetail: String(r.DUTY_LOCATION_DETAIL || r.dutyLocationDetail || '').trim(),
                                dutyType: String(r.DUTY_TYPE || r.dutyType || 'Planlı').trim(),
                                leaveType: String(r.LEAVE_TYPE || r.leaveType || '').trim(),
                                note: String(r.NOTE || r.note || '').trim()
                            })).filter(r => r.personId && r.date && r.status && r.status !== '');

                            memoryCache.attendance = formattedAtt;
                            fastCache.set('attendance', formattedAtt);
                        } else if (!memoryCache.attendance) {
                            memoryCache.attendance = fastCache.get('attendance', []);
                        }

                        memoryCache.loaded = true;
                    } catch (e) {
                        console.warn("Canlı veri senkronizasyonu uyarısı (Önbellek kullanılıyor):", e.message || e);
                        if (!memoryCache.aircraft) memoryCache.aircraft = fastCache.get('aircraft', INITIAL_AIRCRAFT);
                        if (!memoryCache.personnel) memoryCache.personnel = fastCache.get('personnel', INITIAL_PERSONNEL);
                        if (!memoryCache.attendance) memoryCache.attendance = fastCache.get('attendance', []);
                        memoryCache.loaded = true;
                    } finally {
                        memoryCache.preloadPromise = null;
                    }
                })();

                return memoryCache.preloadPromise;
            },
            refresh: async () => {
                memoryCache.preloadPromise = null;
                await storageService.preload();
            },
            getAircraftSync: () => memoryCache.aircraft || INITIAL_AIRCRAFT,
            getPersonnelSync: () => memoryCache.personnel || INITIAL_PERSONNEL,
            getAttendanceSync: () => memoryCache.attendance || [],
            getAircraft: async () => {
                return memoryCache.aircraft || INITIAL_AIRCRAFT;
            },
            saveAircraft: async (data) => {
                memoryCache.aircraft = data;
                fastCache.set('aircraft', data);
                await apiCall('save_aircraft', { aircraft: data }, 60000);
            },
            getPersonnel: async () => {
                return memoryCache.personnel || INITIAL_PERSONNEL;
            },
            savePersonnel: async (data) => {
                memoryCache.personnel = data;
                fastCache.set('personnel', data);
                await apiCall('save_personnel', { personnel: data }, 60000);
            },
            getAttendance: async () => {
                return memoryCache.attendance || [];
            },
            saveAttendance: async (data) => {
                const cleanRecords = (data || []).map(r => ({
                    id: String(r.id || ''),
                    date: normalizeDate(r.date),
                    personId: String(r.personId || ''),
                    status: normalizeAttendanceStatus(r.status),
                    dutyLocation: String(r.dutyLocation || ''),
                    dutyLocationDetail: String(r.dutyLocationDetail || ''),
                    leaveType: String(r.leaveType || ''),
                    note: String(r.note || ''),
                    dutyType: String(r.dutyType || 'Planlı'),
                    includeWeekend: Boolean(r.includeWeekend),
                    aircraftTypeSnapshot: String(r.aircraftTypeSnapshot || '')
                }));

                // Bellekteki ve yerel önbellekteki veriyi ANINDA güncelle
                const existing = memoryCache.attendance || [];
                const others = existing.filter(e => !cleanRecords.some(n => n.personId === e.personId && n.date === e.date));
                const filteredNew = cleanRecords.filter(n => n.status && n.status !== '');
                const merged = [...others, ...filteredNew];
                memoryCache.attendance = merged;
                fastCache.set('attendance', merged);

                // DİĞER BİLGİSAYARLAR VE TELEFONLAR İÇİN GOOGLE TABLO'YA KAYDEDİLMESİNİ BEKLE
                await apiCall('save_attendance', { records: cleanRecords }, 90000);

                return merged;
            },
            fetchSafeImage: async (fileId) => {
                if (window.photoCache[fileId]) return window.photoCache[fileId];
                try {
                    const res = await apiCall('get_safe_image', { fileId });
                    if (res) {
                        window.photoCache[fileId] = res;
                        return res;
                    }
                    return null;
                } catch(e) {
                    return null;
                }
            },
            checkExternalOvertime: async () => {
                try {
                    return await apiCall('check_external_overtime');
                } catch(e) {
                    return { count: 0 };
                }
            },
            syncExternalOvertime: async (filterIds = null) => {
                try {
                    return await apiCall('sync_external_overtime', { filterIds });
                } catch(e) {
                    throw e;
                }
            },
            initBackgroundCaching: async (personnelList) => {
                return; 
            }
        };

        // --- COMPONENTS ---

                records.forEach(r => {
                    if (r && r.status === 'Görev' && r.dutyLocation) {

                        counts[loc] = (counts[loc] || 0) + 1;

                    const countA = counts[aUpper] || 0;
                    const countB = counts[bUpper] || 0;
                    
                    if (countB !== countA) {

                        </button>
                         <button onClick={() => handleStatusClick(AttendanceStatus.COURSE)} className={`px-3 py-1.5 text-xs sm:text-sm border rounded-md transition-all flex-grow sm:flex-grow-0 ${status === AttendanceStatus.COURSE ? 'bg-indigo-600 border-indigo-500 text-white' : 'bg-forest-900 border-forest-700 text-forest-400 hover:border-forest-500'}`}>

                            return (
                                <button key={s} onClick={() => handleStatusClick(s)} className={`px-3 py-1.5 text-xs sm:text-sm border rounded-md transition-all flex-grow sm:flex-grow-0 ${activeClass}`}>
                                    {s}
                                </button>

                        <button

        // AdminPanel Component
        const AdminPanel = ({ onLogout }) => {

            const [selectedHarcirahPersonnelIds, setSelectedHarcirahPersonnelIds] = useState(new Set());
            const [selectedHarcirahDates, setSelectedHarcirahDates] = useState({}); // { personId: Set<dateStr> }

            const [fullAttendanceParams, setFullAttendanceParams] = useState({ model: null, start: '', end: '', searchName: null });
            
            // 2️⃣ Excel Export İlerleme State'i
            const [exportProgress, setExportProgress] = useState(null);

            // Aircraft Form State
            const [acForm, setAcForm] = useState({ id: null, model: '', cat: AircraftCategory.HELICOPTER, tail: 'OR-', city: 'Ankara' });
            
            // Personnel Form State
            const [plForm, setPlForm] = useState({ id: null, name: '', role: Role.PILOT, city: 'Ankara', title: '', start: new Date().toLocaleDateString('en-CA'), unit: '', photoUrl: '', tcNo: '' });
            const [manualTitle, setManualTitle] = useState(false);

            // Modals
            const [deleteModalOpen, setDeleteModalOpen] = useState(false);
            const [personToDelete, setPersonToDelete] = useState(null);
            const [terminationDate, setTerminationDate] = useState('');
            const [photoModalOpen, setPhotoModalOpen] = useState(false);
            const [photoPerson, setPhotoPerson] = useState(null);
            const [zoomLevel, setZoomLevel] = useState(1);

            // 1️⃣ & 3️⃣ Excel/Sheet'ten Kopyala-Yapıştır & Sürükle-Bırak State'i
            const [tempPhotoData, setTempPhotoData] = useState(null);
            const imgRef = useRef(null);

            useEffect(() => {
                setLoading(true);
                Promise.all([
                    storageService.getAircraft().then(setAcList),
                    storageService.getPersonnel().then(p => setPlList(p.sort((a, b) => (a.rank || 999) - (b.rank || 999)))),
                    storageService.getAttendance().then(setAllAttendance)
                ]).finally(() => setLoading(false));
            }, []);

            const showNotify = (msg) => {
                setNotification(msg);
                setTimeout(() => setNotification(null), 3000);
            };

            const handlePhotoAction = async (action, fileData = null) => {
                if (!photoPerson) return;
                setLoading(true);
                try {
                    const payload = { personId: photoPerson.id };
                    const finalFileData = fileData || tempPhotoData;

                    if (action === 'upload_photo' && finalFileData) {
                        payload.fileName = `${photoPerson.id}.jpg`;
                        payload.base64 = finalFileData.split(',')[1];
                    }

                    const result = await apiCall(action, payload);
                    const updatedUrl = action === 'delete_photo' ? '' : fixDriveUrl(result.url);
                    
                    // 3️⃣ Önbelleği senkronize et
                    if (action === 'upload_photo' && finalFileData) {
                        window.photoCache[photoPerson.id] = finalFileData;
                    }
                    if (action === 'delete_photo') {
                        delete window.photoCache[photoPerson.id];
                        const oldMatch = photoPerson.photoUrl.match(/[-\w]{25,}/);
                        if (oldMatch) delete window.photoCache[oldMatch[0]];
                    }

                    // Update state without refresh
                    const updatedList = plList.map(p => p.id === photoPerson.id ? { ...p, photoUrl: updatedUrl } : p);
                    setPlList(updatedList);
                    memoryCache.personnel = updatedList;
                    
                    if (photoPerson) setPhotoPerson({ ...photoPerson, photoUrl: updatedUrl });
                    setTempPhotoData(null); // Önizlemeyi temizle
                    showNotify(action === 'delete_photo' ? "Fotoğraf silindi." : "Fotoğraf güncellendi.");
                } catch (e) {
                    alert("Fotoğraf işlemi hatası: " + e.message);
                } finally {
                    setLoading(false);
                }
            };

            const handleUpdateDriveWithCrop = async () => {
                if (!photoPerson) return;
                
                // Get the current visible image source
                let sourceB64 = tempPhotoData;
                if (!sourceB64 && photoPerson.photoUrl) {
                    const fIdMatch = photoPerson.photoUrl.match(/[-\w]{25,}/);
                    if (fIdMatch) {
                        sourceB64 = window.photoCache[fIdMatch[0]] || await storageService.fetchSafeImage(fIdMatch[0]);
                    }
                }
                
                if (!sourceB64) return;

                // Create offscreen canvas to capture current "cropped" view (WYSIWYG)
                const img = new Image();
                img.onload = async () => {
                    const canvas = document.createElement('canvas');
                    canvas.width = 400;
                    canvas.height = 400;
                    const ctx = canvas.getContext('2d');
                    
                    // Mimic the container style (forest-950 bg)
                    ctx.fillStyle = '#0b2918';
                    ctx.fillRect(0, 0, 400, 400);

                    // Calculation for zoom/crop capture
                    const s = Math.min(img.width, img.height) / zoomLevel;
                    const dx = (img.width - s) / 2;
                    const dy = (img.height - s) / 2;
                    
                    ctx.drawImage(img, dx, dy, s, s, 0, 0, 400, 400);
                    const croppedB64 = canvas.toDataURL('image/jpeg', 0.9);
                    
                    // 1️⃣ KALICI GERÇEKLİK: RAM'deki önbelleği anında güncelle
                    window.photoCache[photoPerson.id] = croppedB64;
                    
                    // 2️⃣ DRIVE GÜNCELLE: Backend'e gönder
                    setLoading(true);
                    try {
                        const payload = { 
                          personId: photoPerson.id,
                          fileName: `${photoPerson.id}.jpg`,
                          base64: croppedB64.split(',')[1]
                        };
                        const result = await apiCall('upload_photo', payload);
                        const updatedUrl = fixDriveUrl(result.url);
                        
                        const updatedList = plList.map(p => p.id === photoPerson.id ? { ...p, photoUrl: updatedUrl } : p);
                        setPlList(updatedList);
                        memoryCache.personnel = updatedList;
                        
                        setPhotoPerson({ ...photoPerson, photoUrl: updatedUrl });
                        setTempPhotoData(null);
                        setZoomLevel(1);
                        showNotify("Drive güncellendi ve yeni görünüm kalıcı hale getirildi.");
                    } catch (e) {
                        alert("Hata: " + e.message);
                    } finally {
                        setLoading(false);
                    }
                };
                img.src = sourceB64;
            };

            const processImageFile = (file) => {
                if (!file || !file.type.startsWith('image/')) return;
                const reader = new FileReader();
                reader.onload = (event) => setTempPhotoData(event.target.result);
                reader.readAsDataURL(file);
            };

            const handleFileUpload = (e) => {
                processImageFile(e.target.files[0]);
            };

            // 1️⃣ Kopyala-Yapıştır Desteği
            const handlePaste = (e) => {
                const items = e.clipboardData.items;
                for (let i = 0; i < items.length; i++) {
                    if (items[i].type.indexOf("image") !== -1) {
                        processImageFile(items[i].getAsFile());
                    }
                }
            };

            // 1️⃣ Sürükle-Bırak Desteği
            const handleDrop = (e) => {
                e.preventDefault();
                processImageFile(e.dataTransfer.files[0]);
            };

            const uniqueModels = useMemo(() => {
                const excluded = ['YÖNETİM', 'TEKNİK EKİP', 'YER DESTEK', 'TEKNİK EKİP VE DESTEK', 'İDARİ BİRİM'];
                const models = [...new Set(acList.map(a => a.model))].filter(m => m && m.length > 1 && !excluded.includes(m));
                if (!models.includes('İDARİ')) models.push('İDARİ');
                return models.sort();
            }, [acList]);

            const saveAc = async () => {
                if (!acForm.model || !acForm.tail) return;
                setLoading(true);
                try {
                    let list = [...acList];
                    if (acForm.id) list = list.map(x => x.id === acForm.id ? { ...x, model: acForm.model, category: acForm.cat, tailNumber: acForm.tail, city: acForm.city } : x);
                    else list.push({ id: Date.now().toString(), model: acForm.model, category: acForm.cat, tailNumber: acForm.tail, city: acForm.city });
                    await storageService.saveAircraft(list);
                    setAcList(list);
                    setAcForm({ id: null, model: '', cat: AircraftCategory.HELICOPTER, tail: 'OR-', city: 'Ankara' });
                    showNotify("Hava aracı kaydedildi.");
                } finally {
                    setLoading(false);
                }
            };

            const deleteAc = async (id, e) => {
                e.preventDefault();
                e.stopPropagation();
                
                const ac = acList.find(x => x.id === id);
                if (!ac) return;

                if (window.confirm(`${ac.tailNumber} kuyruk nolu ${ac.model} aracını silmek istediğinize emin misiniz?`)) {
                    setLoading(true);
                    try {
                        const list = acList.filter(x => x.id !== id);
                        await storageService.saveAircraft(list);
                        setAcList(list);
                        showNotify("Hava aracı silindi.");
                    } catch(e) {
                        console.error(e);
                        alert("Silme işlemi başarısız oldu.");
                    } finally {
                        setLoading(false);
                    }
                }
            };

            const savePl = async () => {
                if (!plForm.name) return;
                setLoading(true);
                try {
                    let list = [...plList];
                    const pData = { 
                        fullName: plForm.name, 
                        role: plForm.role, 
                        city: plForm.city, 
                        title: plForm.title, 
                        activeFrom: plForm.start, 
                        unit: plForm.unit, 
                        photoUrl: plForm.photoUrl, 
                        tcNo: plForm.tcNo,
                        'TC NO': plForm.tcNo // GS tarafındaki olası başlık eşleşmesi için
                    };
                    if (plForm.id) list = list.map(x => x.id === plForm.id ? { ...x, ...pData } : x);
                    else list.push({ id: Date.now().toString(), ...pData, rank: (Math.max(...list.map(x => x.rank || 0), 0) + 1) });
                    await storageService.savePersonnel(list);
                    setPlList(list);
                    setPlForm(prev => ({ ...prev, id: null, name: '', tcNo: '' }));
                    setManualTitle(false);
                    showNotify("Personel kaydedildi.");
                } finally {
                    setLoading(false);
                }
            };

            const initiateDeletePerson = (p) => {
                setPersonToDelete(p);
                setTerminationDate(new Date().toLocaleDateString('en-CA'));
                setDeleteModalOpen(true);
            };

            const terminatePerson = async () => {
                if (!personToDelete) return;
                setLoading(true);
                try {
                    const list = plList.map(p => p.id === personToDelete.id ? { ...p, activeUntil: terminationDate } : p);
                    await storageService.savePersonnel(list);
                    setPlList(list);
                    setDeleteModalOpen(false);
                    setPersonToDelete(null);
                    showNotify("Personel arşivlendi (İşten çıkarıldı).");
                } catch(e) {
                    console.error(e);
                    alert("İşlem başarısız oldu.");
                } finally {
                    setLoading(false);
                }
            };

            const hardDeletePerson = async () => {
                if (!personToDelete) return;
                if (window.confirm(`${personToDelete.fullName} isimli personelin kaydını TAMAMEN silmek üzeresiniz. Bu işlem geri alınamaz. Onaylıyor musunuz?`)) {
                    setLoading(true);
                    try {
                        const list = plList.filter(p => p.id !== personToDelete.id);
                        await storageService.savePersonnel(list);
                        setPlList(list);
                        setDeleteModalOpen(false);
                        setPersonToDelete(null);
                        showNotify("Personel kaydı tamamen silindi.");
                    } catch(e) {
                        console.error(e);
                        alert("Silme işlemi başarısız oldu.");
                    } finally {
                        setLoading(false);
                    }
                }
            };

            const movePl = (idx, dir) => {
                const list = [...plList];
                const tIdx = dir === 'up' ? idx - 1 : idx + 1;
                if (tIdx < 0 || tIdx >= list.length) return;
                
                [list[idx], list[tIdx]] = [list[tIdx], list[idx]];
                setPlList(list);
                setIsOrderChanged(true);
            };

            const saveOrder = async () => {
                setLoading(true);
                try {
                    const updatedList = plList.map((p, i) => ({ ...p, rank: i + 1 }));
                    await storageService.savePersonnel(updatedList);
                    setPlList(updatedList);
                    setIsOrderChanged(false);
                    showNotify("Sıralama kaydedildi.");
                } catch (e) {
                    alert("Sıralama kaydedilemedi: " + e.message);
                } finally {
                    setLoading(false);
                }
            };

            // --- Harcırah Logic ---
            const getMergedHarcirahBlocks = useCallback((datesArray) => {
                if (!datesArray || datesArray.length === 0) return [];
                const sorted = [...datesArray].sort();
                
                const blocks = [];
                let currentBlock = { start: sorted[0], end: sorted[0] };
                
                for (let i = 1; i < sorted.length; i++) {
                    const prevStr = currentBlock.end;
                    const currStr = sorted[i];
                    
                    const d1 = new Date(prevStr); d1.setHours(12,0,0,0);
                    const d2 = new Date(currStr); d2.setHours(12,0,0,0);
                    const gapDays = Math.round((d2 - d1) / (1000 * 60 * 60 * 24));
                    
                    // Gap of up to 3 days includes Friday to Monday weekend bridges
                    if (gapDays <= 3) {
                        currentBlock.end = currStr;
                    } else {
                        blocks.push(currentBlock);
                        currentBlock = { start: currStr, end: currStr };
                    }
                }
                blocks.push(currentBlock);
                return blocks;
            }, []);

            const getBlockSpanLabel = useCallback((block, monthKey) => {
                if (!block || !monthKey) return null;
                const startPart = block.start.substring(0, 7); // "YYYY-MM"
                const endPart = block.end.substring(0, 7);     // "YYYY-MM"
                const isStartDiff = startPart !== monthKey;
                const isEndDiff = endPart !== monthKey;
                
                if (isStartDiff && isEndDiff) {
                    const startMonth = new Date(`${block.start}T12:00:00`).toLocaleDateString('tr-TR', { month: 'long' });
                    const endMonth = new Date(`${block.end}T12:00:00`).toLocaleDateString('tr-TR', { month: 'long' });
                    return `(${startMonth} ayında başlayıp ${endMonth} ayına devam ediyor)`;
                } else if (isStartDiff) {
                    const startMonth = new Date(`${block.start}T12:00:00`).toLocaleDateString('tr-TR', { month: 'long' });
                    return `(${startMonth} ayından başlıyor / devam ediyor)`;
                } else if (isEndDiff) {
                    const endMonth = new Date(`${block.end}T12:00:00`).toLocaleDateString('tr-TR', { month: 'long' });
                    return `(${endMonth} ayına sarkıyor / devam ediyor)`;
                }
                return null;
            }, []);

            const getMajorityMonthOfBlock = useCallback((block) => {
                if (!block) return '';
                const days = getDaysInRange(block.start, block.end);
                const monthCounts = {};
                days.forEach(d => {
                    const dStr = normalizeDate(d);
                    const monthKey = dStr.substring(0, 7); // "YYYY-MM"
                    monthCounts[monthKey] = (monthCounts[monthKey] || 0) + 1;
                });
                
                let maxCount = 0;
                let majorityMonth = '';
                Object.keys(monthCounts).forEach(m => {
                    if (monthCounts[m] > maxCount) {
                        maxCount = monthCounts[m];
                        majorityMonth = m;
                    } else if (monthCounts[m] === maxCount) {
                        if (m < majorityMonth) {
                            majorityMonth = m;
                        }
                    }
                });
                return majorityMonth;
            }, []);

            const isSamePerson = useCallback((id1, id2) => {
                if (!id1 || !id2) return false;
                const s1 = String(id1).trim().toLowerCase();
                const s2 = String(id2).trim().toLowerCase();
                return s1 === s2 || s1.replace(/^p/, '') === s2.replace(/^p/, '');
            }, []);

            const matchHarcirahCity = useCallback((c1, c2) => {
                if (!c1 || !c2) return false;
                return c1.trim().toLocaleUpperCase('tr-TR') === c2.trim().toLocaleUpperCase('tr-TR');
            }, []);

            const isDutyRecord = useCallback((r, city = null) => {
                if (!r) return false;
                const s = String(r.status || '').trim().toLocaleUpperCase('tr-TR');
                const isDuty = s === AttendanceStatus.DUTY.toLocaleUpperCase('tr-TR') || s.includes('GÖREV') || s.includes('GOREV');
                if (!isDuty && !r.dutyLocation) return false;
                if (city) {
                    return matchHarcirahCity(r.dutyLocation, city);
                }
                return Boolean(r.dutyLocation?.trim());
            }, [matchHarcirahCity]);

            const availableHarcirahCities = useMemo(() => {
                const cities = new Set();
                allAttendance.forEach(r => {
                    if (isDutyRecord(r) && r.dutyLocation?.trim()) {
                        cities.add(r.dutyLocation.trim());
                    }
                });
                return Array.from(cities).sort((a, b) => a.localeCompare(b, 'tr-TR'));
            }, [allAttendance, isDutyRecord]);

            const getHarcirahCategory = useCallback((p) => {
                if (!p) return 'DİĞER';
                const title = (p.title || '').toLocaleUpperCase('tr-TR');
                const unit = (p.unit || '').toLocaleUpperCase('tr-TR');
                
                // 1. Doğrudan birim tanımı varsa
                if (unit) {
                    if (unit.includes('BELL')) return 'BELL-429';
                    if (unit.includes('C-650') || unit.includes('C650')) return 'C-650';
                    if (unit.includes('B-360') || unit.includes('B360')) return 'B-360';
                    if (unit.includes('T-70') || unit.includes('T70')) return 'T-70';
                    if (unit.includes('AT-802') || unit.includes('AT802')) return 'AT-802';
                    if (unit.includes('İDARİ') || unit.includes('IDARI')) return 'İDARİ';
                }
                
                // 2. Unvan veya rolde geçen uçak tipleri ve görevler
                if (title.includes('BELL-429') || title.includes('BELL 429') || title.includes('BELL')) return 'BELL-429';
                if (title.includes('C-650') || title.includes('C650')) return 'C-650';
                if (title.includes('B-360') || title.includes('B360')) return 'B-360';
                if (title.includes('T-70') || title.includes('T70')) return 'T-70';
                if (title.includes('AT-802') || title.includes('AT802')) return 'AT-802';
                
                if (title.includes('MEMUR') || title.includes('İDARİ') || title.includes('IDARI')) return 'İDARİ';
                if (unit.includes('TEKNİK EKİP') || title.includes('TEKNİSYEN') || title.includes('TEKNİKER') || title.includes('MÜHENDİS')) return 'TEKNİK EKİPLER';
                if (p.role === Role.DRIVER || title.includes('ŞÖFÖR') || title.includes('SOFOR')) return 'ŞÖFÖRLER';
                return 'DİĞER';
            }, []);

            const handleHarcirahCitySelect = (city) => {
                setSelectedHarcirahCity(city);
                setSelectedHarcirahUnit('');
                setSelectedHarcirahRange(null);
                setExpandedHarcirahMonth(null);
                setHarcirahPersonnel([]);
                setSelectedHarcirahPersonnelIds(new Set());
                setHarcirahStep('city_selected');
            };

            const handleHarcirahUnitSelect = (unitCat) => {
                setSelectedHarcirahUnit(unitCat);
                setSelectedHarcirahRange(null);
                setExpandedHarcirahMonth(null);
                setHarcirahPersonnel([]);
                setSelectedHarcirahPersonnelIds(new Set());
                setHarcirahStep('unit_selected');
            };

            const availableHarcirahRanges = useMemo(() => {
                if (!selectedHarcirahCity || !selectedHarcirahUnit) return [];
                
                const targetPersonnel = plList.filter(p => selectedHarcirahUnit === 'TÜM BİRİMLER' || getHarcirahCategory(p) === selectedHarcirahUnit);
                const monthKeys = new Set();
                
                targetPersonnel.forEach(p => {
                    const personDutyDates = allAttendance.filter(r => 
                        isSamePerson(r.personId, p.id) && 
                        isDutyRecord(r, selectedHarcirahCity)
                    ).map(r => r.date).filter(Boolean).sort();
                    
                    if (personDutyDates.length > 0) {
                        const personBlocks = getMergedHarcirahBlocks(personDutyDates);
                        personBlocks.forEach(b => {
                            const majMonth = getMajorityMonthOfBlock(b);
                            if (majMonth) {
                                monthKeys.add(majMonth);
                            }
                        });
                    }
                });

                if (monthKeys.size === 0) return [];

                const trMonthNames = [
                    "Ocak", "Şubat", "Mart", "Nisan", "Mayıs", "Haziran", 
                    "Temmuz", "Ağustos", "Eylül", "Ekim", "Kasım", "Aralık"
                ];

                const ranges = Array.from(monthKeys).map(key => {
                    const [yearStr, monthStr] = key.split('-');
                    const year = parseInt(yearStr);
                    const monthIdx = parseInt(monthStr) - 1;

                    const start = `${year}-${String(monthIdx + 1).padStart(2, '0')}-01`;
                    const lastDay = new Date(year, monthIdx + 1, 0).getDate();
                    const end = `${year}-${String(monthIdx + 1).padStart(2, '0')}-${String(lastDay).padStart(2, '0')}`;

                    return {
                        start,
                        end,
                        label: `${trMonthNames[monthIdx]} ${year}`,
                        monthKey: key
                    };
                });

                // Sort ranges chronologically (newest first)
                ranges.sort((a, b) => b.monthKey.localeCompare(a.monthKey));
                return ranges;
            }, [selectedHarcirahCity, selectedHarcirahUnit, allAttendance, plList, getMergedHarcirahBlocks, getMajorityMonthOfBlock, getHarcirahCategory, isSamePerson, isDutyRecord]);

            const getMonthSubBlocks = useCallback((monthKey) => {
                if (!selectedHarcirahCity || !selectedHarcirahUnit) return [];
                const targetPersonnel = plList.filter(p => selectedHarcirahUnit === 'TÜM BİRİMLER' || getHarcirahCategory(p) === selectedHarcirahUnit);
                const allUnitDutyDates = allAttendance.filter(r => 
                    targetPersonnel.some(p => isSamePerson(r.personId, p.id)) && 
                    isDutyRecord(r, selectedHarcirahCity)
                ).map(r => r.date);
                const uniqueDates = [...new Set(allUnitDutyDates)].sort();
                const allBlocks = getMergedHarcirahBlocks(uniqueDates);
                return allBlocks.filter(b => getMajorityMonthOfBlock(b) === monthKey);
            }, [selectedHarcirahCity, selectedHarcirahUnit, allAttendance, plList, getMergedHarcirahBlocks, getMajorityMonthOfBlock, getHarcirahCategory, isSamePerson, isDutyRecord]);

            const toggleHarcirahDate = (personId, dateStr) => {
                setSelectedHarcirahDates(prev => {
                    const next = { ...prev };
                    const dates = new Set(next[personId] || []);
                    if (dates.has(dateStr)) {
                        dates.delete(dateStr);
                    } else {
                        dates.add(dateStr);
                    }
                    next[personId] = dates;

                    setSelectedHarcirahPersonnelIds(prevIds => {
                        const nextIds = new Set(prevIds);
                        if (dates.size === 0) {
                            nextIds.delete(personId);
                        } else {
                            nextIds.add(personId);
                        }
                        return nextIds;
                    });

                    return next;
                });
            };

            const handleHarcirahRangeSelect = (range) => {
                setSelectedHarcirahRange(range);
                
                const targetPersonnel = plList.filter(p => selectedHarcirahUnit === 'TÜM BİRİMLER' || getHarcirahCategory(p) === selectedHarcirahUnit);
                
                const eligible = [];
                const initialDates = {};
                
                targetPersonnel.forEach(p => {
                    const personDutyDates = allAttendance.filter(r => 
                        isSamePerson(r.personId, p.id) && 
                        isDutyRecord(r, selectedHarcirahCity)
                    ).map(r => r.date).filter(Boolean).sort();
                    
                    const personBlocks = getMergedHarcirahBlocks(personDutyDates);
                    const matchBlocks = personBlocks.filter(b => getMajorityMonthOfBlock(b) === range.monthKey);
                    if (matchBlocks.length > 0) {
                        eligible.push(p);
                        const dates = new Set();
                        matchBlocks.forEach(b => {
                            const datesInBlock = getDaysInRange(b.start, b.end).map(d => normalizeDate(d));
                            datesInBlock.forEach(dStr => dates.add(dStr));
                        });
                        initialDates[p.id] = dates;
                    }
                });

                setHarcirahPersonnel(eligible);
                setSelectedHarcirahDates(initialDates);
                setSelectedHarcirahPersonnelIds(new Set(eligible.map(p => p.id))); // Auto-select all eligible by default
                
                setHarcirahStep('range_selected');
            };

            const toggleHarcirahPerson = (id) => {
                setSelectedHarcirahPersonnelIds(prevIds => {
                    const nextIds = new Set(prevIds);
                    const isSelected = nextIds.has(id);
                    if (isSelected) {
                        nextIds.delete(id);
                        setSelectedHarcirahDates(prevDates => {
                            const nextDates = { ...prevDates };
                            nextDates[id] = new Set();
                            return nextDates;
                        });
                    } else {
                        nextIds.add(id);
                        setSelectedHarcirahDates(prevDates => {
                            const nextDates = { ...prevDates };
                            const dates = new Set();
                            const personDutyDates = allAttendance.filter(r => 
                                isSamePerson(r.personId, id) && 
                                isDutyRecord(r, selectedHarcirahCity)
                            ).map(r => r.date).sort();
                            
                            const personBlocks = getMergedHarcirahBlocks(personDutyDates);
                            const matchBlocks = personBlocks.filter(b => getMajorityMonthOfBlock(b) === selectedHarcirahRange.monthKey);
                            
                            matchBlocks.forEach(b => {
                                const datesInBlock = getDaysInRange(b.start, b.end).map(d => normalizeDate(d));
                                datesInBlock.forEach(dStr => dates.add(dStr));
                            });
                            nextDates[id] = dates;
                            return nextDates;
                        });
                    }
                    return nextIds;
                });
            };

            const toggleHarcirahBlock = (personId, block) => {
                const datesInBlock = getDaysInRange(block.start, block.end).map(d => normalizeDate(d));
                setSelectedHarcirahDates(prev => {
                    const next = { ...prev };
                    const currentSelectedSet = new Set(next[personId] || []);
                    const blockCurrentlySelected = datesInBlock.every(d => currentSelectedSet.has(d));
                    
                    if (blockCurrentlySelected) {
                        datesInBlock.forEach(d => currentSelectedSet.delete(d));
                    } else {
                        datesInBlock.forEach(d => currentSelectedSet.add(d));
                    }
                    next[personId] = currentSelectedSet;
                    
                    setSelectedHarcirahPersonnelIds(prevIds => {
                        const nextIds = new Set(prevIds);
                        if (currentSelectedSet.size === 0) {
                            nextIds.delete(personId);
                        } else {
                            nextIds.add(personId);
                        }
                        return nextIds;
                    });

                    return next;
                });
            };

            const addAllHarcirahPersonnel = () => {
                const nextPersonIds = new Set(harcirahPersonnel.map(p => p.id));
                setSelectedHarcirahPersonnelIds(nextPersonIds);
                setSelectedHarcirahDates(prev => {
                    const next = { ...prev };
                    harcirahPersonnel.forEach(p => {
                        const dates = new Set();
                        const personDutyDates = allAttendance.filter(r => 
                            isSamePerson(r.personId, p.id) && 
                            isDutyRecord(r, selectedHarcirahCity)
                        ).map(r => r.date).sort();
                        
                        const personBlocks = getMergedHarcirahBlocks(personDutyDates);
                        const matchBlocks = personBlocks.filter(b => getMajorityMonthOfBlock(b) === selectedHarcirahRange.monthKey);
                        
                        matchBlocks.forEach(b => {
                            const datesInBlock = getDaysInRange(b.start, b.end).map(d => normalizeDate(d));
                            datesInBlock.forEach(dStr => dates.add(dStr));
                        });
                        next[p.id] = dates;
                    });
                    return next;
                });
            };

            const exportHarcirahExcel = async () => {
                if (selectedHarcirahPersonnelIds.size === 0) return;
                setLoading(true);
                try {
                    const workbook = new ExcelJS.Workbook();
                    const worksheet = workbook.addWorksheet('Harcırah Listesi');

                    const currentYear = selectedHarcirahRange ? new Date(selectedHarcirahRange.start).getFullYear() : new Date().getFullYear();

                    // Row Heights & Spacing
                    worksheet.getRow(1).height = 30;
                    worksheet.getRow(2).height = 15;

                    // Header Title (Row 1 centered, Row 2 blank, no unnecessary ministry text)
                    worksheet.mergeCells('A1:H1');
                    const titleCell = worksheet.getCell('A1');
                    titleCell.value = `${currentYear} YILI HARCIRAH GÖREV LİSTESİ`;
                    titleCell.font = { bold: true, size: 14 };
                    titleCell.alignment = { horizontal: 'center', vertical: 'middle' };

                    // Table Headers (Row 3)
                    const headers = ['SIRA', 'AD SOYAD', 'TC NO', 'UNVAN', 'GÖREV YERİ', 'BAŞLANGIÇ', 'BİTİŞ', 'GÜN'];
                    worksheet.getRow(3).values = headers;
                    worksheet.getRow(3).font = { bold: true };
                    worksheet.getRow(3).height = 20;
                    worksheet.getRow(3).eachCell((cell, colNumber) => {
                        cell.border = { top: { style: 'thin' }, left: { style: 'thin' }, bottom: { style: 'thin' }, right: { style: 'thin' } };
                        cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFD9D9D9' } };
                        cell.alignment = { horizontal: 'center', vertical: 'middle' };
                    });

                    const selectedPeople = harcirahPersonnel.filter(p => selectedHarcirahPersonnelIds.has(p.id));
                    let lastDataRowIndex = 3;
                    let blockCounter = 1;

                    selectedPeople.forEach((p) => {
                        const selectedDatesForPerson = Array.from(selectedHarcirahDates[p.id] || []).sort();
                        const blocks = getMergedHarcirahBlocks(selectedDatesForPerson);
                        
                        blocks.forEach((block) => {
                            const rowIndex = lastDataRowIndex + 1;
                            lastDataRowIndex = rowIndex;
                            worksheet.getRow(rowIndex).height = 18;
                            
                            const d1 = new Date(block.start); d1.setHours(12,0,0,0);
                            const d2 = new Date(block.end); d2.setHours(12,0,0,0);
                            
                            const hStart = new Date(d1);
                            const hEnd = new Date(d2);
                            const diffDays = Math.round((d2 - d1) / (1000 * 60 * 60 * 24)) + 1;

                            const rowData = [
                                blockCounter++,
                                p.fullName,
                                p.tcNo || '',
                                getDisplayTitle(p.title, p.role),
                                selectedHarcirahCity,
                                hStart.toLocaleDateString('tr-TR'),
                                hEnd.toLocaleDateString('tr-TR'),
                                diffDays
                            ];
                            
                            worksheet.getRow(rowIndex).values = rowData;
                            worksheet.getRow(rowIndex).eachCell((cell) => {
                                cell.border = { top: { style: 'thin' }, left: { style: 'thin' }, bottom: { style: 'thin' }, right: { style: 'thin' } };
                                cell.alignment = { horizontal: 'center', vertical: 'middle' };
                            });
                        });
                    });

                    // Signature Block
                    const rank1Person = plList.find(p => p.rank === 1) || { fullName: 'MEHMET SEFA YÜCEDAĞ', title: 'Uçuş İşletme ve Eğitim Şube Müdürü' };
                    const sigTitle = rank1Person.title?.toLocaleUpperCase('tr-TR').includes('MÜDÜR') ? rank1Person.title : 'Uçuş İşletme ve Eğitim Şube Müdürü';
                    
                    // Signature block starts 4 rows below the last data row
                    const sigStartRow = lastDataRowIndex + 4;
                    const sigEndRow = sigStartRow + 3; // 4 rows total
                    
                    worksheet.mergeCells(`F${sigStartRow}:G${sigEndRow}`);
                    const sigCell = worksheet.getCell(`F${sigStartRow}`);
                    sigCell.value = `${rank1Person.fullName}\n${sigTitle}`;
                    sigCell.alignment = { horizontal: 'center', vertical: 'middle', wrapText: true };
                    sigCell.font = { bold: true };

                    worksheet.columns = [
                        { width: 8 }, { width: 30 }, { width: 20 }, { width: 25 }, { width: 20 }, { width: 18 }, { width: 18 }, { width: 10 }
                    ];

                    const buffer = await workbook.xlsx.writeBuffer();
                    const blob = new Blob([buffer], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
                    const link = document.createElement('a');
                    link.href = URL.createObjectURL(blob);
                    link.download = `Harcirah_${selectedHarcirahCity}_${selectedHarcirahUnit}_${currentYear}.xlsx`;
                    link.click();
                } catch (e) {
                    alert("Excel hatası: " + e.message);
                } finally {
                    setLoading(false);
                }
            };

            const exportPersonnelCsv = () => {
                let csv = '\uFEFFSIRA;AD SOYAD;TC NO;UNVAN;BİRİM;BÖLGE\n';
                plList.forEach((p, i) => {
                    csv += `${i + 1};"${p.fullName}";"${p.tcNo || ''}";"${getDisplayTitle(p.title, p.role)}";"${p.unit || ''}";"${p.city}"\n`;
                });
                const link = document.createElement('a');
                link.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
                link.download = 'Personel_Listesi.csv';
                link.click();
            };

            // 3️⃣ & 4️⃣ Resimli Excel Raporu (Gördüğünü Al WYSIWYG Flow)
            const exportPersonnelExcel = async () => {
                const unitOrder = ["BELL-429", "C-650", "B-360", "T-70", "AT-802", "İDARİ"];
                const getPUnit = (pers) => {
                    if (pers.unit && unitOrder.includes(pers.unit)) return pers.unit;
                    if (pers.unit === 'İDARİ BİRİM' || pers.unit === 'TEKNİK EKİP' || pers.unit === 'YER DESTEK') return "İDARİ";
                    const titleUpper = (pers.title || '').toLocaleUpperCase('tr-TR');
                    if (titleUpper.includes('BELL')) return "BELL-429";
                    if (titleUpper.includes('C-650')) return "C-650";
                    if (titleUpper.includes('B-360')) return "B-360";
                    if (titleUpper.includes('T-70')) return "T-70";
                    if (titleUpper.includes('AT-802')) return "AT-802";
                    return "İDARİ";
                };
                
                const activePersonnel = plList
                    .filter(p => !p.activeUntil)
                    .sort((a, b) => {
                        const unitA = getPUnit(a);
                        const unitB = getPUnit(b);
                        const idxA = unitOrder.indexOf(unitA);
                        const idxB = unitOrder.indexOf(unitB);
                        if (idxA !== idxB) return idxA - idxB;
                        return (a.rank || 999) - (b.rank || 999);
                    });

                if (activePersonnel.length === 0) return;

                setExportProgress(1); // 4️⃣ Progress Start
                
                const workbook = new ExcelJS.Workbook();
                const worksheet = workbook.addWorksheet('Personel Listesi');
                
                // 5️⃣ & 6️⃣ Excel Tablo Stili ve Başlık Satırı
                worksheet.columns = [
                    { header: 'SIRA NO', key: 'sira', width: 12 },
                    { header: 'AD SOYADI', key: 'ad', width: 35 },
                    { header: 'TC NO', key: 'tc', width: 22 },
                    { header: 'BİRİMİ', key: 'birim', width: 25 },
                    { header: 'FOTOĞRAF', key: 'foto', width: 20 }
                ];

                worksheet.getRow(1).font = { color: { argb: 'FFFFFFFF' }, bold: true };
                worksheet.getRow(1).fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF228B22' } };
                worksheet.getRow(1).alignment = { vertical: 'middle', horizontal: 'center' };
                worksheet.getRow(1).height = 30;

                let preparedCount = 0;
                // Daha yüksek kalite için canvas boyutu artırıldı
                const offscreenCanvas = document.createElement('canvas');
                offscreenCanvas.width = 400;
                offscreenCanvas.height = 400;
                const ctx = offscreenCanvas.getContext('2d');

                for (let i = 0; i < activePersonnel.length; i++) {
                    const p = activePersonnel[i];
                    const rowIndex = i + 2;
                    // Satır yüksekliği 100% artırıldı
                    worksheet.getRow(rowIndex).height = 110;
                    worksheet.getCell(`A${rowIndex}`).value = i + 1;
                    worksheet.getCell(`B${rowIndex}`).value = p.fullName;
                    worksheet.getCell(`C${rowIndex}`).value = p.tcNo || '';
                    worksheet.getCell(`D${rowIndex}`).value = p.unit || getDisplayTitle(p.title, p.role);
                    
                    let sourceB64 = window.photoCache[p.id];
                    if (!sourceB64 && p.photoUrl) {
                        const fIdMatch = p.photoUrl.match(/[-\w]{25,}/);
                        if (fIdMatch) sourceB64 = await storageService.fetchSafeImage(fIdMatch[0]);
                    }

                    if (sourceB64) {
                        try {
                            const imgB64 = await new Promise((resolve) => {
                                const img = new Image();
                                img.onload = () => {
                                    ctx.fillStyle = '#0b2918'; 
                                    ctx.fillRect(0, 0, 400, 400);
                                    const s = Math.min(img.width, img.height);
                                    ctx.drawImage(img, (img.width - s) / 2, (img.height - s) / 2, s, s, 0, 0, 400, 400);
                                    resolve(offscreenCanvas.toDataURL('image/jpeg', 0.95)); // En yüksek kalite
                                };
                                img.onerror = () => resolve(null);
                                img.src = sourceB64;
                            });

                            if (imgB64) {
                                const imageId = workbook.addImage({
                                    base64: imgB64,
                                    extension: 'jpeg',
                                });
                                // Resim boyutu artırıldı
                                worksheet.addImage(imageId, {
                                    tl: { col: 4.1, row: i + 1.1 },
                                    ext: { width: 140, height: 140 }
                                });
                            }
                        } catch(e) { console.error("Image error", e); }
                    }

                    preparedCount++;
                    setExportProgress((preparedCount / activePersonnel.length) * 100);
                    if (preparedCount % 5 === 0) await new Promise(r => setTimeout(r, 10));
                }

                worksheet.eachRow((row) => {
                    row.eachCell((cell) => {
                        cell.border = { top: { style: 'thin' }, left: { style: 'thin' }, bottom: { style: 'thin' }, right: { style: 'thin' } };
                        cell.alignment = { vertical: 'middle', horizontal: 'center' };
                    });
                });

                if (preparedCount === activePersonnel.length) {
                    const buffer = await workbook.xlsx.writeBuffer();
                    const blob = new Blob([buffer], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
                    const link = document.createElement('a');
                    link.href = URL.createObjectURL(blob);
                    link.download = `Resimli_Personel_Listesi_${new Date().toLocaleDateString('tr-TR')}.xlsx`;
                    link.click();
                    setTimeout(() => setExportProgress(null), 800);
                }
            };

            if (loading) return (
                <div className="fixed inset-0 bg-black/80 z-50 flex flex-col items-center justify-center">
                    <div className="w-64 h-64 mb-4 rounded-full border-8 border-forest-400 overflow-hidden shadow-[0_0_40px_rgba(0,0,0,0.6)]">
                        <img src="https://media4.giphy.com/media/v1.Y2lkPTc5MGI3NjExNW9uenhqZXdxbGd6YWNxc2UwempmOXNyaG15NGtuZTJmb3EyaTNqZCZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9cw/1rrxPs1nb3IjwmbiXw/giphy.gif" alt="Loading..." className="w-full h-full object-cover" />
                    </div>
                    <div className="text-white text-xl font-bold animate-pulse">Bekleyiniz</div>
                </div>
            );

            return (
                <div className="container mx-auto p-4 max-w-6xl relative">
                    {/* 4️⃣ Progress Bar Modal (Zorunlu) */}
                    {exportProgress !== null && (
                        <div className="fixed inset-0 bg-black/70 z-[200] flex items-center justify-center p-4 backdrop-blur-sm">
                            <div className="bg-forest-900 border border-forest-500 p-8 rounded-2xl max-w-sm w-full shadow-2xl text-center animate-slide-down">
                                <div className="text-white font-bold mb-4 text-lg uppercase tracking-widest">Rapor Hazırlanıyor</div>
                                <div className="w-full bg-forest-950 rounded-full h-6 mb-3 border border-forest-700 overflow-hidden p-1 shadow-inner">
                                    <div className="bg-gradient-to-r from-green-600 via-green-400 to-green-500 h-full rounded-full transition-all duration-300" style={{ width: `${exportProgress}%` }}></div>
                                </div>
                                <div className="text-green-400 text-sm font-bold font-mono">%{Math.round(exportProgress)} Tamamlandı</div>
                                <p className="text-forest-400 text-[11px] mt-4 leading-tight">Fotoğraflar frontend RAM önbellekten yakalanarak Excel dosyasına embedded image olarak gömülüyor.</p>
                            </div>
                        </div>
                    )}

                    {notification && (
                        <div className="absolute top-0 right-0 m-4 bg-green-600 text-white px-4 py-2 rounded shadow-lg animate-slide-down z-50 flex items-center">
                            <CheckCircle size={18} className="mr-2" /> {notification}
                        </div>
                    )}
                    <div className="flex justify-between mb-6">
                        <h2 className="text-2xl font-bold">Yönetici Paneli</h2>
                        <div className="flex gap-2">
                             {isOrderChanged && (
                                 <button onClick={saveOrder} className="bg-orange-600 hover:bg-orange-500 text-white px-4 py-2 text-sm rounded-md font-bold shadow-lg animate-pulse flex items-center gap-2">
                                     <LucideIcons.Save size={16} /> Sıralamayı Kaydet
                                 </button>
                             )}
                             {/* WEB GÖRÜNÜMÜ BİREBİR Excel Butonu */}
                             <button onClick={exportPersonnelExcel} className="btn-excel flex items-center gap-2 px-4 py-2 text-sm rounded-md font-bold shadow-md transition-all">
                                <FileText size={16} /> Personel Listesi Excel (Resimli)
                             </button>
                             <Button variant="secondary" onClick={onLogout}>
                                <LogOut className="mr-2" size={16} /> Çıkış
                             </Button>
                        </div>
                    </div>
                    <div className="flex gap-2 mb-6 border-b border-forest-600 pb-2">
                        <button onClick={() => setTab('aircraft')} className={`px-4 py-2 rounded ${tab === 'aircraft' ? 'bg-forest-600 text-white' : 'text-forest-300'}`}>Hava Araçları</button>
                        <button onClick={() => setTab('personnel')} className={`px-4 py-2 rounded ${tab === 'personnel' ? 'bg-forest-600 text-white' : 'text-forest-300'}`}>Personel</button>
                        <button onClick={() => setTab('harcirah')} className={`px-4 py-2 rounded ${tab === 'harcirah' ? 'bg-forest-600 text-white' : 'text-forest-300'}`}>Harcırah</button>
                    </div>

                    {tab === 'aircraft' ? (
                        <div className="grid lg:grid-cols-3 gap-6">
                            <Card title={acForm.id ? "Düzenle" : "Ekle"} className="h-fit">
                                <div className="space-y-3">
                                    <input placeholder="Ad (Örn: BELL-429)" className="w-full bg-forest-950 border border-forest-700 rounded p-2 text-white" value={acForm.model} onChange={e => setAcForm({ ...acForm, model: e.target.value })} />
                                    <div className="flex gap-1">
