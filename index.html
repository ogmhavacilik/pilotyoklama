                    <button onClick={onClose} className="absolute sm:relative top-4 right-4 sm:top-0 sm:right-0 bg-white/10 hover:bg-red-600 text-white p-2 sm:p-3 rounded-full transition-all duration-300 group shadow-lg">
                        <LucideIcons.X className="group-hover:rotate-90 transition-transform w-6 h-6 sm:w-8 sm:h-8" />
                    </button>
                </div>
            );

            const PersonItem = ({ p }) => {
                let displayName = p.fullName;
                if (type === 'GÖREV') {
                    const resolved = resolvePersonStatus(p, today, attendance);
                    if (resolved && resolved.dutyLocationDetail && resolved.dutyLocationDetail.trim()) {
                        displayName = `${p.fullName} (${resolved.dutyLocationDetail.trim()})`.toLocaleUpperCase('tr-TR');
                    }
                }
                return (
                    <div className="flex items-center gap-4 p-3 bg-forest-950/40 rounded-xl border border-forest-700/30 hover:border-orange-500/30 hover:bg-forest-800/40 transition-all duration-300 group shadow-sm hover:shadow-orange-500/10">
                        <div className="hidden sm:block w-12 h-12 rounded-lg border border-forest-700/50 overflow-hidden bg-forest-900 flex-shrink-0 group-hover:border-orange-500/30 transition-colors">
                            <SafeImage src={p.photoUrl} personId={p.id} className="personnel-photo-square" />
                        </div>
                        <div className="overflow-hidden">
                            <div className="text-sm sm:text-base font-bold text-white group-hover:text-orange-400 transition-colors truncate">{displayName}</div>
                            <div className="text-[10px] sm:text-xs text-forest-400 font-semibold uppercase tracking-wider truncate">{getDisplayTitle(p.title, p.role)}</div>
                        </div>
                    </div>
                );
            };

            const GroupedPersonList = ({ list, emptyMessage, cols = "sm:grid-cols-2" }) => {
                const unitsPresent = unitOrder.filter(unit => list.some(p => getPUnit(p) === unit));
                
                if (list.length === 0) return <p className="text-center text-forest-400 py-10 italic">{emptyMessage}</p>;

                return (
                    <div className="space-y-6">
                        {unitsPresent.map(unit => {
                            const peopleInUnit = list.filter(p => getPUnit(p) === unit)
                                .sort((a, b) => (a.rank || 999) - (b.rank || 999));
                            
                            return (
                                <div key={unit} className="space-y-2">
                                    <div className="flex items-center gap-3">
                                        <div className="text-[10px] sm:text-xs font-black text-orange-500/80 uppercase tracking-[0.2em] whitespace-nowrap">
                                            {unit}
                                        </div>
                                        <div className="h-px bg-forest-800 flex-1"></div>
                                        <span className="text-[10px] font-bold text-forest-600 bg-forest-900/50 px-2 py-0.5 rounded-full">{peopleInUnit.length}</span>
                                    </div>
                                    <div className={`grid grid-cols-1 ${cols} gap-2`}>
                                        {peopleInUnit.map(p => <PersonItem key={p.id} p={p} />)}
                                    </div>
                                </div>
                            );
                        })}
                    </div>
                );
            };



            if (type === 'MESAI') {
                const mesaiList = filteredPersonnel.filter(p => {
                    const resolved = resolvePersonStatus(p, today, attendance);
                    return resolved?.status === AttendanceStatus.PRESENT;
                }).sort((a, b) => (a.rank || 999) - (b.rank || 999));

                const beklemeList = filteredPersonnel.filter(p => {
                    const resolved = resolvePersonStatus(p, today, attendance);
                    return resolved?.status === AttendanceStatus.OTHER && resolved?.note?.toLocaleUpperCase('tr-TR').includes('BEKLEME');
                }).sort((a, b) => (a.rank || 999) - (b.rank || 999));

                const filteredMesai = mesaiList.filter(p => !beklemeList.find(b => b.id === p.id));

                return (
                    <div className="fixed inset-0 bg-forest-950/98 z-[200] overflow-y-auto p-4 md:p-8 md:px-12 animate-fade-in backdrop-blur-xl flex flex-col">
                        <div className="w-full">
                            <Header />
                            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4 md:gap-12">
                                <div>
                                    <h3 className="text-xl sm:text-2xl font-black text-green-400 mb-4 sm:mb-6 flex items-center gap-3 bg-green-950/30 p-3 sm:p-4 rounded-lg border-l-4 border-green-500">
                                        MESAİDE OLANLAR ({filteredMesai.length})
                                    </h3>
                                    <GroupedPersonList list={filteredMesai} emptyMessage="Mesaide personel bulunamadı." />
                                </div>
                                <div>
                                    <h3 className="text-xl sm:text-2xl font-black text-blue-400 mb-4 sm:mb-6 flex items-center gap-3 bg-blue-950/30 p-3 sm:p-4 rounded-lg border-l-4 border-blue-500">
                                        BEKLEME YAZILANLAR ({beklemeList.length})
                                    </h3>
                                    <GroupedPersonList list={beklemeList} emptyMessage="Bekleme yazılan personel bulunamadı." />
                                </div>
                            </div>
                        </div>
                    </div>
                );
            }

            if (type === 'GÖREV') {
                const resolvedPersonnel = filteredPersonnel.map(p => {
                    const resolved = resolvePersonStatus(p, today, attendance);
                    return { p, resolved };
                });

                const dutyPeople = resolvedPersonnel.filter(item => item.resolved?.status === AttendanceStatus.DUTY);
                const locations = [...new Set(dutyPeople.map(item => (item.resolved?.dutyLocation || 'BELİRSİZ').toLocaleUpperCase('tr-TR')))].sort();

                return (
                    <div className="fixed inset-0 bg-forest-950/98 z-[200] overflow-y-auto p-4 md:p-8 md:px-12 animate-fade-in backdrop-blur-xl flex flex-col">
                        <div className="w-full">
                            <Header />
                            {locations.length === 0 ? (
                                <div className="text-center py-10 sm:py-20 bg-forest-900/20 rounded-3xl border border-dashed border-forest-700">
                                    <LucideIcons.Search size={64} className="mx-auto text-forest-600 mb-4" />
                                    <p className="text-forest-400 text-lg sm:text-xl">Bugün görevde olan personel bulunamadı.</p>
                                </div>
                            ) : (
                                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4 sm:gap-6 pb-12 pt-2 w-full">
                                    {locations.map(loc => {
                                        const peopleInLoc = dutyPeople
                                            .filter(item => (item.resolved?.dutyLocation || 'BELİRSİZ').toLocaleUpperCase('tr-TR') === loc)
                                            .map(item => item.p)
                                            .sort((a, b) => (a.rank || 999) - (b.rank || 999));
                                        
                                        return (
                                            <div key={loc} className="bg-forest-900/40 p-4 sm:p-6 rounded-2xl border border-forest-700/50 shadow-2xl w-full h-fit hover:border-orange-500/30 transition-all duration-300">
                                                <h3 className="text-lg sm:text-xl font-black text-orange-400 mb-4 sm:mb-6 flex items-center gap-3 border-b border-orange-500/30 pb-3 uppercase tracking-tighter sticky top-0 bg-forest-900/10 backdrop-blur-sm z-10">

                const fmiPeople = filteredPersonnel.filter(p => {

                return (
                    <div className="fixed inset-0 bg-forest-950/98 z-[200] overflow-y-auto p-4 md:p-8 md:px-12 animate-fade-in backdrop-blur-xl flex flex-col">

                                <h3 className="text-xl md:text-3xl font-black text-yellow-400 mb-6 md:mb-8 flex items-center justify-center gap-4 bg-yellow-950/20 py-4 md:py-6 rounded-2xl border-2 border-yellow-500/30 shadow-2xl text-center px-4">
                                    FAZLA MESAİ İZNİ (F.M.İ) <span className="bg-yellow-500 text-yellow-950 px-3 md:px-4 py-1 rounded-full text-base md:text-xl">{fmiPeople.length}</span>

                );

            return null;
        };

        // Mobile Attendance Control Component (Ultra-fast touch targets for mobile)
        const MobileAttendanceControl = ({ personId, state, isWeeklyMode, onChangeStatus, onChangeDetail, isWeekend, sortedCities }) => {
            const status = state?.status;
            const cityOptions = useMemo(() => {
                return sortedCities || [...CITIES].sort((a, b) => a.localeCompare(b, 'tr'));
            }, [sortedCities]);

            const handleStatusClick = (newStatus) => {
                if (isWeekend && status === newStatus) {
                    onChangeStatus(personId, undefined);
                } else {
                    onChangeStatus(personId, newStatus);
                }
            };

            return (
                <div className="w-full space-y-2 mt-2">
                    <div className="grid grid-cols-4 gap-1.5 text-center">
                        <button 
                            type="button"
                            onClick={() => handleStatusClick(AttendanceStatus.PRESENT)} 
                            className={`py-2 px-1 text-[11px] font-bold rounded border transition-all active:scale-95 ${status === AttendanceStatus.PRESENT ? 'bg-green-600 border-green-400 text-white shadow-md' : 'bg-forest-950 border-forest-800 text-forest-300'}`}
                        >
                            Mevcut
                        </button>
                        <button 
                            type="button"
                            onClick={() => handleStatusClick(AttendanceStatus.DUTY)} 
                            className={`py-2 px-1 text-[11px] font-bold rounded border transition-all active:scale-95 ${status === AttendanceStatus.DUTY ? 'bg-blue-600 border-blue-400 text-white shadow-md' : 'bg-forest-950 border-forest-800 text-forest-300'}`}
                        >
                            Görev
                        </button>
                        <button 
                            type="button"
                            onClick={() => handleStatusClick(AttendanceStatus.COURSE)} 
                            className={`py-2 px-1 text-[11px] font-bold rounded border transition-all active:scale-95 ${status === AttendanceStatus.COURSE ? 'bg-indigo-600 border-indigo-400 text-white shadow-md' : 'bg-forest-950 border-forest-800 text-forest-300'}`}
                        >
                            Kurs
                        </button>
                        <button 
                            type="button"
                            onClick={() => handleStatusClick(AttendanceStatus.LEAVE)} 
                            className={`py-2 px-1 text-[11px] font-bold rounded border transition-all active:scale-95 ${status === AttendanceStatus.LEAVE ? 'bg-yellow-600 border-yellow-400 text-white shadow-md' : 'bg-forest-950 border-forest-800 text-forest-300'}`}
                        >
                            İzin
                        </button>
                        <button 
                            type="button"
                            onClick={() => handleStatusClick(AttendanceStatus.SICK)} 
                            className={`py-2 px-1 text-[11px] font-bold rounded border transition-all active:scale-95 ${status === AttendanceStatus.SICK ? 'bg-red-600 border-red-400 text-white shadow-md' : 'bg-forest-950 border-forest-800 text-forest-300'}`}
                        >
                            Rapor
                        </button>
                        <button 
                            type="button"
                            onClick={() => handleStatusClick(AttendanceStatus.PUBLIC_HOLIDAY)} 
                            className={`py-2 px-1 text-[11px] font-bold rounded border transition-all active:scale-95 ${status === AttendanceStatus.PUBLIC_HOLIDAY ? 'bg-orange-600 border-orange-400 text-white shadow-md' : 'bg-forest-950 border-forest-800 text-forest-300'}`}
                        >
                            İ.İzin
                        </button>
                        <button 
                            type="button"
                            onClick={() => handleStatusClick(AttendanceStatus.OTHER)} 
                            className={`py-2 px-1 text-[11px] font-bold rounded border transition-all active:scale-95 ${status === AttendanceStatus.OTHER ? 'bg-purple-600 border-purple-400 text-white shadow-md' : 'bg-forest-950 border-forest-800 text-forest-300'}`}
                        >
                            Diğer
                        </button>
                        <button 
                            type="button"
                            onClick={() => handleStatusClick(AttendanceStatus.ABSENT)} 
                            className={`py-2 px-1 text-[11px] font-bold rounded border transition-all active:scale-95 ${status === AttendanceStatus.ABSENT ? 'bg-red-800 border-red-600 text-white shadow-md' : 'bg-forest-950 border-forest-800 text-forest-300'}`}
                        >
                            Yok
                        </button>
                    </div>

                    {status === AttendanceStatus.DUTY && (
                        <div className="bg-forest-950 p-2 rounded border border-blue-600/40 space-y-2 mt-1">
                            <div className="flex gap-3 text-xs text-forest-300">
                                <label className="flex items-center gap-1 cursor-pointer">
                                    <input type="radio" checked={state?.dutyType !== DutyType.UNPLANNED} onChange={() => onChangeDetail(personId, 'dutyType', DutyType.PLANNED)} className="accent-forest-500" /> Planlı
                                </label>
                                <label className="flex items-center gap-1 cursor-pointer">
                                    <input type="radio" checked={state?.dutyType === DutyType.UNPLANNED} onChange={() => onChangeDetail(personId, 'dutyType', DutyType.UNPLANNED)} className="accent-forest-500" /> Plansız
                                </label>
                                {isWeeklyMode && state?.dutyType !== DutyType.UNPLANNED && (
                                    <label className="flex items-center gap-1 cursor-pointer bg-forest-800 px-2 py-0.5 rounded ml-auto text-[10px] text-white">
                                        <input type="checkbox" checked={!!state?.includeWeekend} onChange={(e) => onChangeDetail(personId, 'includeWeekend', e.target.checked)} className="accent-forest-500" /> H.Sonu
                                    </label>
                                )}
                            </div>
                            <select
                                className="bg-forest-900 border border-forest-700 text-white text-xs rounded p-2 w-full outline-none"
                                value={(!state?.dutyLocation) ? "" : ((state.dutyLocation === 'YURT DIŞI' || CITIES.includes(state.dutyLocation)) ? state.dutyLocation : 'YURT DIŞI')}
                                onChange={(e) => onChangeDetail(personId, 'dutyLocation', e.target.value)}
                            >
                                <option value="" disabled>Görev Yeri Seç</option>
                                {cityOptions.map(c => <option key={c} value={c}>{c}</option>)}
                                <option value="YURT DIŞI">DİĞER / YURT DIŞI</option>
                            </select>
                            {state?.dutyLocation && (
                                <input 
                                    type="text" 
                                    placeholder="Bölge adı (Opsiyonel)" 
                                    className="bg-forest-900 border border-forest-700 text-white text-xs rounded p-2 w-full outline-none" 
                                    value={state.dutyLocationDetail || ''} 
                                    onChange={(e) => onChangeDetail(personId, 'dutyLocationDetail', e.target.value)} 
                                />
                            )}
                        </div>
                    )}

                    {status === AttendanceStatus.LEAVE && (
                        <div className="bg-forest-950 p-2 rounded border border-yellow-600/40 mt-1">
                            <select 
                                className="bg-forest-900 border border-forest-700 text-white text-xs rounded p-2 w-full outline-none" 
                                value={state?.leaveType || LeaveType.DAILY} 
                                onChange={(e) => onChangeDetail(personId, 'leaveType', e.target.value)}
                            >
                                <option value={LeaveType.DAILY}>Günlük İzin (G.İ)</option>
                                <option value={LeaveType.OVERTIME}>Fazla Mesai İzni (F.M.İ)</option>
                                <option value={LeaveType.HALF_OVERTIME}>Yarım Gün F.M.İ (Y.F.M.İ)</option>
                                <option value={LeaveType.ANNUAL}>Yıllık İzin (Yİ)</option>
                                <option value={LeaveType.EXCUSE}>Mazeret İzni (M.İ)</option>
                                <option value={LeaveType.HALF_DAY}>Yarım Gün İzin (Y.G.İ)</option>
                            </select>
                        </div>
                    )}

                    {status === AttendanceStatus.COURSE && (
                        <div className="bg-forest-950 p-2 rounded border border-indigo-600/40 mt-1">
                            <input 
                                type="text" 
                                placeholder="Kurs Adı..." 
                                className="bg-forest-900 border border-forest-700 text-white text-xs rounded p-2 w-full outline-none" 
                                value={state?.dutyLocation || ''} 
                                onChange={(e) => onChangeDetail(personId, 'dutyLocation', e.target.value)} 
                            />
                        </div>
                    )}

                    {status === AttendanceStatus.OTHER && (
                        <div className="bg-forest-950 p-2 rounded border border-purple-600/40 mt-1">
                            <input 
                                type="text" 
                                placeholder="Açıklama giriniz..." 
                                className="bg-forest-900 border border-forest-700 text-white text-xs rounded p-2 w-full outline-none" 
                                value={state?.note || ''} 
                                onChange={(e) => onChangeDetail(personId, 'note', e.target.value)} 
                            />
                        </div>
                    )}
                </div>
            );
        };

        const AttendanceView = ({ initialModel = null, initialStartDate = getTodayString(), initialEndDate = getTodayString(), initialSearchName = null, onSave: onSaveExternal }) => {
            const [isMobile, setIsMobile] = useState(() => typeof window !== 'undefined' && (window.innerWidth < 768 || /iPhone|iPad|iPod|Android/i.test(navigator.userAgent)));
            const [selectedMobileUnit, setSelectedMobileUnit] = useState('');
            const [showRangeReportModal, setShowRangeReportModal] = useState(false);
            const [rangeExportStart, setRangeExportStart] = useState(initialStartDate);
            const [rangeExportEnd, setRangeExportEnd] = useState(initialEndDate);

            const sortedCities = useMemo(() => {
                return [...CITIES].sort((a, b) => a.localeCompare(b, 'tr'));
            }, []);

            useEffect(() => {
                const handleResize = () => setIsMobile(window.innerWidth < 768 || /iPhone|iPad|iPod|Android/i.test(navigator.userAgent));
                window.addEventListener('resize', handleResize);
                return () => window.removeEventListener('resize', handleResize);
            }, []);
            const [selModel, setSelModel] = useState(initialModel);
            const [searchName, setSearchName] = useState(initialSearchName);
            const [rangeStartDate, setRangeStartDate] = useState(initialStartDate);
            const [rangeEndDate, setRangeEndDate] = useState(initialEndDate);
            
            const [models, setModels] = useState([]);
            const [inv, setInv] = useState([]);
            const [allRecs, setAllRecs] = useState([]);
            const [allPersonnel, setAllPersonnel] = useState([]);
            const [dashboardStatus, setDashboardStatus] = useState({});

            const [people, setPeople] = useState([]);
            const [att, setAtt] = useState({});
            const [loading, setLoading] = useState(true);
            const [isOrderChanged, setIsOrderChanged] = useState(false);

            // Tab State
            const [activeTab, setActiveTab] = useState('PILOT');

            // Modal
            const [detailModalOpen, setDetailModalOpen] = useState(false);
            const [detailPerson, setDetailPerson] = useState(null);
            const [detailDays, setDetailDays] = useState({});

            // Tooltip state for photo hover
            const [hoverPhoto, setHoverPhoto] = useState(null);
            const [mousePos, setMousePos] = useState({ x: 0, y: 0 });

            // Report
            const [dates, setDates] = useState({ start: getTodayString(), end: getTodayString() });
            const [isReportReady, setIsReportReady] = useState(false);
            const [reportUnit, setReportUnit] = useState('TÜM BİRİMLER');
            const [reportSearch, setReportSearch] = useState('');
            const [reportModalType, setReportModalType] = useState(null);

            const showAttendanceFromReport = () => {
                if (reportUnit === 'TÜM BİRİMLER') {
                    alert('Lütfen bir birim seçiniz.');
                    return;
                }
                setRangeStartDate(dates.start);
                setRangeEndDate(dates.end);
                setSelModel(reportUnit);
            };

            // Security States
            const [isEditUnlocked, setIsEditUnlocked] = useState(false);
            const [showUnlockModal, setShowUnlockModal] = useState(false);
            const [unlockPassword, setUnlockPassword] = useState('');
            const [pendingAction, setPendingAction] = useState(null);

            // External Overtime Sync
            const [syncOvertimeCount, setSyncOvertimeCount] = useState(0);
            const [syncOvertimeRecords, setSyncOvertimeRecords] = useState([]);
            const [skippedRecordIds, setSkippedRecordIds] = useState(new Set());
            const [showSyncModal, setShowSyncModal] = useState(false);
            const [showSyncDetails, setShowSyncDetails] = useState(false);
            const [isSyncing, setIsSyncing] = useState(false);

            // Units Loading & Auto-save States
            const [isUnitsLoading, setIsUnitsLoading] = useState(true);
            const [hasUnsavedChanges, setHasUnsavedChanges] = useState(false);
            const [autoSaveCountdown, setAutoSaveCountdown] = useState(null);
            const [isSaving, setIsSaving] = useState(false);
            const [saveVerifiedMsg, setSaveVerifiedMsg] = useState(null);

            const autoSaveTimerRef = useRef(null);
            const countdownIntervalRef = useRef(null);
            const saveRef = useRef(null);
            const savePromiseRef = useRef(null);
            const hasUnsavedChangesRef = useRef(false);

            useEffect(() => {
                hasUnsavedChangesRef.current = hasUnsavedChanges;
            }, [hasUnsavedChanges]);

            const triggerAutoSaveCountdown = useCallback(() => {
                setHasUnsavedChanges(true);
                setSaveVerifiedMsg(null);

                if (autoSaveTimerRef.current) clearTimeout(autoSaveTimerRef.current);
                if (countdownIntervalRef.current) clearInterval(countdownIntervalRef.current);

                setAutoSaveCountdown(15);

                countdownIntervalRef.current = setInterval(() => {
                    setAutoSaveCountdown(prev => {
                        if (prev === null || prev <= 1) {
                            if (countdownIntervalRef.current) clearInterval(countdownIntervalRef.current);
                            return 0;
                        }
                        return prev - 1;
                    });
                }, 1000);

                autoSaveTimerRef.current = setTimeout(() => {
                    if (saveRef.current) {
                        saveRef.current(true);
                    }
                }, 15000);
            }, []);

            // Data Load
            const loadDashboardData = useCallback(() => {
                try {
                    const ac = storageService.getAircraftSync();
                    const pl = storageService.getPersonnelSync();
                    const recs = storageService.getAttendanceSync();

                    // UNITS DEFINITION: YÖNETİM, TEKNİK EKİP ve YER DESTEK YOKTUR; İDARİ VARDIR VE İDARİ OLARAK YAZILIR
                    const UNITS_ORDER = ['BELL-429', 'C-650', 'B-360', 'T-70', 'AT-802', 'İDARİ'];

                    let updatedAc = [...ac].filter(a => 
                        a.model !== 'TEKNİK EKİP VE DESTEK' && 
                        a.model !== 'TEKNİK EKİP' && 
                        a.model !== 'YER DESTEK' && 
                        a.model !== 'İDARİ BİRİM'
                    );
                    let modified = updatedAc.length !== ac.length;
                    
                    if (!updatedAc.find(a => a.model === 'İDARİ')) {
                        updatedAc.push({ id: '24', tailNumber: 'İDARİ', model: 'İDARİ', category: AircraftCategory.GROUND, city: 'Ankara' });
                        modified = true;
                    }

                    if (modified) {
                        storageService.saveAircraft(updatedAc);
                    }

                    setInv(updatedAc);
                    setModels(UNITS_ORDER);
                    setAllPersonnel(pl);
                    if (!hasUnsavedChangesRef.current && !savePromiseRef.current) {
                        setAllRecs(recs || []);
                    }

                    const finalPersonnel = pl;
                    if (finalPersonnel.length > 0) {
                        const statusMap = {};
                        const today = getTodayString();
                        
                        // O(1) Instant lookup Set for today's recorded attendance (supports both 'p1' and '1')
                        const todayRecordPersonIds = new Set();
                        if (recs && recs.length > 0) {
                            for (let i = 0; i < recs.length; i++) {
                                const r = recs[i];
                                if (r.date === today && r.status && r.status !== '') {
                                    const rawPid = String(r.personId).trim();
                                    const cleanPid = rawPid.replace(/^p/i, '');
                                    todayRecordPersonIds.add(rawPid);
                                    todayRecordPersonIds.add(cleanPid);
                                    todayRecordPersonIds.add('p' + cleanPid);
                                }
                            }
                        }

                        const specificAircraftTags = ['BELL429', 'C650', 'B360', 'T70', 'AT802'];

                        UNITS_ORDER.forEach(m => {
                            const mNameNormalized = m.replace(/[^a-zA-Z0-9ğüşıöçĞÜŞİÖÇ]/g, '').toLocaleUpperCase('tr-TR');
                            
                            const relevantPersonnel = finalPersonnel.filter(p => {
                                if (YONETIM_NAMES.includes(p.fullName)) return false;

                                const pStart = p.activeFrom || '2000-01-01';
                                const pEnd = p.activeUntil || '2099-12-31';
                                if (today < pStart || today > pEnd) return false;

                                if (m === 'İDARİ') {
                                    return (p.title || '').toLocaleUpperCase('tr-TR').includes('MEMUR');
                                }

                                if (p.unit) {
                                    return p.unit === m;
                                }

                                const titleUpper = (p.title || '').toLocaleUpperCase('tr-TR');
                                const tClean = titleUpper.replace(/[^a-zA-Z0-9ğüşıöçĞÜŞİÖÇ]/g, '');
                                return tClean.includes(mNameNormalized);
                            });

                            if (m === 'İDARİ') {
                                const missingCount = relevantPersonnel.some(p => {
                                    const pid = String(p.id).trim();
                                    const clean = pid.replace(/^p/i, '');
                                    return !todayRecordPersonIds.has(pid) && !todayRecordPersonIds.has(clean) && !todayRecordPersonIds.has('p' + clean);
                                });
                                statusMap['İDARİ'] = {
                                    groundMissing: relevantPersonnel.length > 0 && missingCount,
                                    pilotMissing: false
                                };
                            } else {
                                const checkExists = (persList) => persList.length > 0 && persList.some(p => {
                                    const pid = String(p.id).trim();
                                    const clean = pid.replace(/^p/i, '');
                                    return todayRecordPersonIds.has(pid) || todayRecordPersonIds.has(clean) || todayRecordPersonIds.has('p' + clean);
                                });

                                const dataExists = checkExists(relevantPersonnel);

                                statusMap[m] = {
                                    pilotMissing: relevantPersonnel.length > 0 && !dataExists,
                                    groundMissing: false
                                };
                            }
                        });

                        setDashboardStatus(statusMap);
                    }
                } catch (err) {
                    console.error("Error loading dashboard data:", err);
                }
            }, []);

            useEffect(() => {
                saveRef.current = save;
            });

            const handleUnitSelection = (unit) => {
                if (hasUnsavedChanges) {
                    save(true);
                }
                setSelModel(unit);
            };

            const [isLiveSyncing, setIsLiveSyncing] = useState(false);

            useEffect(() => {
                // 1. Önbellekteki verilerle ANINDA VE KİLİTSİZ yükle (0 milisaniye bekleme)
                loadDashboardData();
                setLoading(false);
                setIsUnitsLoading(false);

                // 2. Arka planda Google E-Tablo ile sessizce eşitlen (UI asla donmaz/kilitlenmez)
                setIsLiveSyncing(true);
                const targetDate = dates.start || getTodayString();
                storageService.preload(targetDate)
                    .then(() => {
                        loadDashboardData();
                    })
                    .catch(e => {
                        console.warn("Hızlı veri senkronizasyonu uyarısı:", e);
                    })
                    .finally(() => {
                        setIsUnitsLoading(false);
                        setIsLiveSyncing(false);
                    });
            }, [dates.start, loadDashboardData]);

            const handleBackToDashboard = () => {
                if (hasUnsavedChanges) {
                    save(true);
                }
                setSelModel(null);
                setIsOrderChanged(false);
                // ANINDA VE SIFIR GECİKMELİ DÖNÜŞ: Sunucu sorgusu beklemeden, mevcut bellek verisiyle anında göster
                loadDashboardData();
            };

            const handleSyncOvertime = async () => {
                setIsSyncing(true);
                try {
                    const recordsToSync = syncOvertimeRecords.filter(r => !skippedRecordIds.has(r.id));
                    if (recordsToSync.length === 0) {
                        setShowSyncModal(false);
                        return;
                    }
                    // We need a specific call or internal logic to sync ONLY selective ones
                    // Since komut.gs sync_external_overtime syncs ALL, I might need a new action or update the existing one
                    // But for now, if they want to skip, let's just sync all and they can revert? 
                    // No, better to update komut.gs to accept a list of IDs to sync.
                    
                    const res = await storageService.syncExternalOvertime(recordsToSync.map(r => r.id));
                    alert(`${res.imported} adet veri başarıyla aktarıldı.`);
                    setShowSyncModal(false);
                    setLoading(true);
                    await storageService.refresh();
                    await loadDashboardData();
                } catch (e) {
                    alert("Aktarım sırasında hata oluştu: " + e.message);
                } finally {
                    setIsSyncing(false);
                    setLoading(false);
                }
            };

            const movePerson = (index, direction) => {
                const newPeople = [...people];
                if (direction === 'up' && index > 0) {
                    [newPeople[index], newPeople[index - 1]] = [newPeople[index - 1], newPeople[index]];
                } else if (direction === 'down' && index < newPeople.length - 1) {
                    [newPeople[index], newPeople[index + 1]] = [newPeople[index + 1], newPeople[index]];
                }
                setPeople(newPeople);
                setIsOrderChanged(true);
            };

            const saveOrder = async () => {
                setLoading(true);
                try {
                    // Update RANK for all personnel based on current order in 'people'
                    // Note: 'people' is a subset, but we should update their rank globally
                    const updatedGlobalList = allPersonnel.map(p => {
                        const idx = people.findIndex(x => x.id === p.id);
                        if (idx !== -1) {
                            return { ...p, rank: idx + 1 };
                        }
                        return p;
                    });
                    
                    await storageService.savePersonnel(updatedGlobalList);
                    setAllPersonnel(updatedGlobalList);
                    setIsOrderChanged(false);
                    alert("Sıralama kaydedildi.");
                } catch (e) {
                    alert("Sıralama kaydedilemedi: " + e.message);
                } finally {
                    setLoading(false);
                }
            };

            useEffect(() => {
                if (selModel || searchName) {
                    setLoading(true);
                    setActiveTab('PILOT');

                    let targetP = [];

                    if (searchName && !selModel) {
                        // Search by name across all personnel
                        targetP = allPersonnel.filter(p => 
                            p.fullName.toLocaleUpperCase('tr-TR').includes(searchName.toLocaleUpperCase('tr-TR'))
                        );
                    } else if (selModel === 'İDARİ' || selModel === AircraftModel.IDARI) {
                        const specificAircraftTags = ['BELL429', 'C650', 'B360', 'T70', 'AT802'];
                        targetP = allPersonnel.filter(p => {
                            if (YONETIM_NAMES.includes(p.fullName)) return false;

                            const pStart = p.activeFrom || '2000-01-01';
                            const pEnd = p.activeUntil || '2099-12-31';
                            const isActiveInRange = pStart <= rangeEndDate && pEnd >= rangeStartDate;
                            if (!isActiveInRange) return false;

                            if (p.unit) {
                                return (p.title || '').toLocaleUpperCase('tr-TR').includes('MEMUR');
                            }

                            const titleUpper = (p.title || '').toLocaleUpperCase('tr-TR');

                const days = getDaysInRange(rangeStartDate, rangeEndDate);

                            }

                const recs = [];

                                counter++;

                const extendedWeekendDates = new Set();

                    const satDate = new Date(lastDay); satDate.setDate(satDate.getDate() + 1);
                    const sunDate = new Date(lastDay); sunDate.setDate(sunDate.getDate() + 2);
                    const satStr = normalizeDate(satDate);
                    const sunStr = normalizeDate(sunDate);

                    if (!dayStrings.includes(satStr)) extendedWeekendDates.add(satStr);
                    if (!dayStrings.includes(sunStr)) extendedWeekendDates.add(sunStr);

                    people.forEach(p => {
                        if (personsToSkip.has(p.id)) return;

                        if (s.includeWeekend && (s.status === AttendanceStatus.DUTY || s.status === AttendanceStatus.LEAVE)) {

                                const existingRec = allRecs.find(r => r.personId === p.id && r.date === extraDate);

                            if (s.includeWeekend && (s.status === AttendanceStatus.DUTY || s.status === AttendanceStatus.LEAVE)) {
                                const dType = s.dutyType || DutyType.PLANNED;
                                counter++;
                                const existingRec = allRecs.find(r => r.personId === p.id && r.date === sunStr);
                                recs.push({
                                    id: (existingRec && existingRec.id) ? existingRec.id : `${timestamp}-${counter}-${p.id}`,
                                    date: sunStr,
                                    personId: p.id,
                                    status: s.status,
                                    dutyLocation: s.dutyLocation,
                                    dutyLocationDetail: s.dutyLocationDetail,

                                });

                const boundedRecs = recs.filter(r => dayStrings.includes(r.date) || extendedWeekendDates.has(r.date));

                    if (!isAutoSave) {
                        setSaveVerifiedMsg("Kaydedildi ✓");
                        setTimeout(() => setSaveVerifiedMsg(null), 2500);

                    setSaveVerifiedMsg(null);
                    alert('Sistem e-tabloya kaydedilemedi hatası: ' + (e.message || 'E-tabloya yazma başarısız oldu.'));
                } finally {

            savePromiseRef.current = runSave();
            try {
                await savePromiseRef.current;
            } finally {
                savePromiseRef.current = null;
            }
        };

            const handleAttendanceChange = (pid, status) => {
                setAtt(prev => ({ 
                    ...prev,

                        status,
